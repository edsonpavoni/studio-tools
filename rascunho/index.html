<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rascunho">
<meta name="theme-color" content="#f5f2eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>rascunho</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-mode="draw">

<!-- the sheet: app.js puts its canvas here -->
<div id="sheet"></div>
<!-- drawing aid: faint dots or hairlines on the paper (body[data-grid]) -->
<div id="aid"></div>
<!-- a clean-paper wash used by "new sheet" -->
<div id="wash"></div>
<!-- paper grain, above everything, never catches a touch -->
<div id="grain"></div>

<div id="ui">

  <!-- grid mode only: back to the sheet -->
  <div class="ctl" id="back" role="button" aria-label="back to sheet">
    <svg viewBox="0 0 24 24"><path d="M20 12H4.5M10.5 6l-6 6 6 6"/></svg>
  </div>

  <!-- the one row along the bottom edge: left · centre (centred on the screen) · right -->
  <div id="row">

    <div id="left" class="group">
      <div class="ctl" id="undo" role="button" aria-label="undo">
        <svg viewBox="0 0 24 24"><path d="M5 9.5h9.5a4.75 4.75 0 0 1 0 9.5H9"/><path d="M8.5 6 5 9.5 8.5 13"/></svg>
      </div>
      <div class="ctl" id="aidbtn" role="button" aria-label="paper grid" data-grid="off">
        <svg class="g-lines" viewBox="0 0 24 24"><path d="M9 4.5v15M15 4.5v15M4.5 9h15M4.5 15h15"/></svg>
        <svg class="g-dots" viewBox="0 0 24 24"><circle cx="6" cy="6" r="1.1"/><circle cx="12" cy="6" r="1.1"/><circle cx="18" cy="6" r="1.1"/><circle cx="6" cy="12" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="18" cy="12" r="1.1"/><circle cx="6" cy="18" r="1.1"/><circle cx="12" cy="18" r="1.1"/><circle cx="18" cy="18" r="1.1"/></svg>
      </div>
    </div>

    <div id="centre" class="group">
      <!-- tools as words -->
      <div id="tools" role="radiogroup" aria-label="tool">
        <div class="tool" data-tool="2h" role="radio" aria-label="2H pencil"><span>2H</span></div>
        <div class="tool" data-tool="hb" role="radio" aria-label="HB pencil"><span>HB</span></div>
        <div class="tool" data-tool="4b" role="radio" aria-label="4B pencil"><span>4B</span></div>
        <div class="tool" data-tool="eraser" role="radio" aria-label="eraser"><span>eraser</span></div>
      </div>
      <!-- colours: five quick dots, a live "chosen" sixth, a dotted ring that opens the full list -->
      <div id="colourswrap">
        <div id="palette" aria-hidden="true"></div>
        <div id="colours" role="radiogroup" aria-label="colour"></div>
      </div>
    </div>

    <div id="right" class="group">
      <div class="ctl" id="new" role="button" aria-label="new sheet">
        <svg viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15"/></svg>
      </div>
      <div class="ctl" id="gridbtn" role="button" aria-label="all sheets">
        <svg viewBox="0 0 24 24"><circle cx="7.5" cy="8.5" r="1.5"/><circle cx="16.5" cy="8.5" r="1.5"/><circle cx="7.5" cy="15.5" r="1.5"/><circle cx="16.5" cy="15.5" r="1.5"/></svg>
      </div>
      <!-- the send unit, one short sentence: "send to" (quiet) · session name (ink, the switch) · ↗ (ink, sends) -->
      <div id="sendgroup">
        <div class="ctl text" id="sendto" role="button" aria-label="send to the connected session">send to</div>
        <div id="sessionwrap">
          <div id="sessions" role="listbox" aria-label="sessions"></div>
          <div class="ctl text" id="session" role="button" aria-label="connected session, tap to change">book</div>
        </div>
        <div class="ctl" id="send" role="button" aria-label="send">
          <svg class="arrow" viewBox="0 0 24 24"><path d="M6 18 18 6M9 6h9v9"/></svg>
          <!-- the Oracle hamsa (OracleEars menu-bar icon): shown for 2 s after a successful send. the eye is cut out, paper shows through -->
          <svg class="hamsa" viewBox="0 0 18 18" aria-hidden="true">
            <mask id="hamsa-eye"><rect width="18" height="18" fill="#fff"/><circle cx="9" cy="12.2" r="2.5" fill="#000"/></mask>
            <g mask="url(#hamsa-eye)">
              <rect x="7.6" y="0.6" width="2.8" height="8.4" rx="1.4"/>
              <rect x="5" y="2" width="2.7" height="7.6" rx="1.35"/>
              <rect x="10.3" y="2" width="2.7" height="7.6" rx="1.35"/>
              <rect x="4.6" y="7.4" width="8.8" height="9.6" rx="4"/>
              <ellipse cx="4.2" cy="9.6" rx="2.2" ry="1.8"/>
              <ellipse cx="13.8" cy="9.6" rx="2.2" ry="1.8"/>
            </g>
            <circle cx="9" cy="12.2" r="1"/>
          </svg>
        </div>
      </div>
    </div>

  </div>

  <!-- long-press parameters, hairlines only -->
  <div id="params" aria-hidden="true"></div>

  <div class="caption" id="undo-hint">or tap with two fingers</div>
  <div class="caption" id="toast"></div>

</div>

<!-- past sheets -->
<div id="grid" aria-hidden="true"><div class="sheets"></div></div>

<script type="module" src="ui.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
