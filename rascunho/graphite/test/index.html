<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>graphite test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; -webkit-user-select: none; user-select: none; }
  #sheet { position: fixed; left: 0; top: 0; touch-action: none; -webkit-touch-callout: none; cursor: crosshair; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; font: 12px/1 -apple-system, system-ui, sans-serif; z-index: 2; }
  #bar button { padding: 7px 9px; border: 1px solid #bbb; background: #fafafa; color: #222; border-radius: 4px; font: inherit; }
  #bar button.on { background: #222; color: #fff; border-color: #222; }
  #bar .sep { width: 6px; }
  #stats { position: fixed; right: 8px; bottom: 8px; font: 11px/1.4 ui-monospace, Menlo, monospace; color: #666; white-space: pre; z-index: 2; pointer-events: none; }
</style>
</head>
<body>
<canvas id="sheet"></canvas>
<div id="bar"></div>
<div id="stats"></div>
<script type="module">
import { createEngine, PENCIL_GRADES, tiltToSpherical } from "../engine/engine.js";

// ---- sheet: SS engine pixels per screen (device) pixel, like the reference (4)
const params = new URLSearchParams(location.search);
const SS = Math.max(1, Math.min(6, +(params.get("ss") || 4)));
const dpr = Math.min(window.devicePixelRatio || 1, 3);
const canvas = document.getElementById("sheet");
const ctx = canvas.getContext("2d", { alpha: false });
// backing store = device pixels of the initial viewport; CSS box follows the window
const PW = Math.round(innerWidth * dpr), PH = Math.round(innerHeight * dpr);
canvas.width = PW; canvas.height = PH;
let rect;
function layout() {
  canvas.style.width = innerWidth + "px"; canvas.style.height = innerHeight + "px";
  rect = canvas.getBoundingClientRect();
}
layout();
addEventListener("resize", layout);
window.visualViewport?.addEventListener("resize", layout);

const eng = createEngine({ width: PW * SS, height: PH * SS, paper: params.get("paper") || "noise" });
const img = ctx.createImageData(PW, PH);
eng.blitDown({ x0: 0, y0: 0, x1: PW * SS, y1: PH * SS }, img.data, PW, SS);
ctx.putImageData(img, 0, 0);

// client → sheet pixels, through the canvas's real box (toolbar changes etc.)
function toSheet(cx, cy) {
  return [(cx - rect.left) * (PW / rect.width) * SS, (cy - rect.top) * (PH / rect.height) * SS];
}

// ---- minimal bar
let tool = "HB", fingerDraws = false;
const bar = document.getElementById("bar");
const buttons = {};
function btn(label, fn, id = label) {
  const b = document.createElement("button"); b.textContent = label;
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); e.stopPropagation(); });
  b.addEventListener("click", fn); bar.appendChild(b); buttons[id] = b; return b;
}
function sep() { const s = document.createElement("span"); s.className = "sep"; bar.appendChild(s); }
// tool sizes are in reference document pixels (4 per device pixel); scale for other SS.
// One size per tool, remembered in localStorage; slider is exponential 2…200 like the reference.
let sizes = {};
try { sizes = JSON.parse(localStorage.getItem("graphite.sizes") || "{}"); } catch (_) {}
// pencils 2…200, erasers and finger 10…800 (reference document px)
const range = (name) => (eng.setTool(name).kind === "pencil" ? [2, 200] : [10, 800]);
const sizeOf = (name) => sizes[name] ?? eng.setTool(name).size;
function useTool(name) { eng.setTool(name, { size: sizeOf(name) * SS / 4 }); }
function pick(t) {
  tool = t; useTool(t);
  for (const k in buttons) buttons[k].classList.toggle("on", k === t);
  buttons.finger.classList.toggle("on", fingerDraws);
  const sz = sizeOf(t), [lo, hi] = range(t);
  slider.value = Math.log(sz / lo) / Math.log(hi / lo);
  sizeLabel.textContent = "size " + sz;
}
PENCIL_GRADES.forEach((g) => btn(g, () => pick(g)));
sep(); ["eraser", "kneaded", "smudge"].forEach((t) => btn(t, () => pick(t)));
sep(); btn("undo", () => blit(eng.undo())); btn("redo", () => blit(eng.redo())); btn("clear", () => blit(eng.clear()));
sep(); btn("finger draws", () => { fingerDraws = !fingerDraws; pick(tool); }, "finger");
sep();
const slider = document.createElement("input");
slider.type = "range"; slider.min = 0; slider.max = 1; slider.step = 0.005; slider.style.width = "140px"; slider.style.margin = "0 4px";
slider.addEventListener("pointerdown", (e) => e.stopPropagation());
slider.addEventListener("input", () => {
  const [lo, hi] = range(tool);
  const sz = Math.round(lo * Math.pow(hi / lo, +slider.value));
  sizes[tool] = sz; sizeLabel.textContent = "size " + sz; useTool(tool);
  try { localStorage.setItem("graphite.sizes", JSON.stringify(sizes)); } catch (_) {}
});
bar.appendChild(slider);
const sizeLabel = document.createElement("span"); sizeLabel.style.cssText = "align-self:center;color:#444;min-width:60px"; bar.appendChild(sizeLabel);
const resetBtn = btn("reset size", () => { delete sizes[tool]; try { localStorage.setItem("graphite.sizes", JSON.stringify(sizes)); } catch (_) {} pick(tool); }, "reset");
pick("HB");

// ---- blit a dirty rect (sheet px) through the downsampler
function blit(r) {
  if (!r) return;
  const s = eng.blitDown(r, img.data, PW, SS);
  if (s) ctx.putImageData(img, 0, 0, s.x0, s.y0, s.x1 - s.x0, s.y1 - s.y0);
}

// ---- input: Pencil draws with the chosen tool; one finger smudges (or draws)
const stats = document.getElementById("stats");
let msAvg = 0, events = 0, samples = 0, activeId = null, activeType = null;
function sample(e) {
  let altitude, azimuth;
  if (typeof e.altitudeAngle === "number") { altitude = e.altitudeAngle; azimuth = e.azimuthAngle; }
  else ({ altitude, azimuth } = tiltToSpherical(e.tiltX || 0, e.tiltY || 0));
  let p = e.pressure;
  if (e.pointerType !== "pen") p = 0.5;          // mouse and finger: flat pressure
  const [x, y] = toSheet(e.clientX, e.clientY);
  return [x, y, p, altitude, azimuth];
}
function down(e) {
  if (activeId !== null) return;
  if (e.pointerType === "touch" && !fingerDraws) useTool("smudge"); else useTool(tool);   // sizes are per tool
  activeId = e.pointerId; activeType = e.pointerType;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* synthetic events have no active pointer */ }
  const t0 = performance.now();
  blit(eng.strokeBegin(...sample(e)));
  tick(performance.now() - t0, 1);
}
function move(e) {
  if (e.pointerId !== activeId) return;
  const t0 = performance.now();
  const list = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  let r = null, n = 0;
  const feed = (ev) => { const d = eng.strokeMove(...sample(ev)); if (d) r = r ? union(r, d) : d; n++; };
  if (list.length) list.forEach(feed); else feed(e);
  blit(r);
  tick(performance.now() - t0, n);
}
function up(e) {
  if (e.pointerId !== activeId) return;
  const s = sample(e);
  blit(eng.strokeEnd(s[0], s[1], 0, s[3], s[4]));
  activeId = null;
}
function union(a, b) { return { x0: Math.min(a.x0, b.x0), y0: Math.min(a.y0, b.y0), x1: Math.max(a.x1, b.x1), y1: Math.max(a.y1, b.y1) }; }
function tick(ms, n) {
  events++; samples += n; msAvg = msAvg * 0.95 + ms * 0.05;
  if ((events & 7) === 0) stats.textContent = `${eng.tool.name}  ${ms.toFixed(2)} ms/event (avg ${msAvg.toFixed(2)})  samples/event ${(samples / events).toFixed(1)}  ss ${SS}  dpr ${dpr}  ${activeType || ""}`;
}
const opts = { passive: false };
canvas.addEventListener("pointerdown", (e) => { e.preventDefault(); down(e); }, opts);
canvas.addEventListener("pointermove", (e) => { e.preventDefault(); move(e); }, opts);
canvas.addEventListener("pointerup", (e) => { e.preventDefault(); up(e); }, opts);
canvas.addEventListener("pointercancel", (e) => { e.preventDefault(); up(e); }, opts);
canvas.addEventListener("touchstart", (e) => e.preventDefault(), opts);
canvas.addEventListener("touchmove", (e) => e.preventDefault(), opts);
canvas.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("gesturestart", (e) => e.preventDefault(), opts);
addEventListener("keydown", (e) => {
  if (e.key === "z") blit(eng.undo()); else if (e.key === "y") blit(eng.redo());
  else if (e.key === "e") pick("eraser"); else if (e.key === "s") pick("smudge");
  else if (/^[1-6]$/.test(e.key)) pick(PENCIL_GRADES[+e.key - 1]);
});
window.graphite = { eng, blit, pick, SS, toSheet };
</script>
</body>
</html>
