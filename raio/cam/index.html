<!doctype html>
<html lang="en" data-kind="console" data-face="nigredo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>RaioEye</title>
<link rel="stylesheet" href="studio.css">
<style>
/* what is this thing? the eye of the laser bench: a dark room where the only light is what the camera sees, and one line of state under it. */
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); min-height: 100vh; display: flex; flex-direction: column; }
header { display: flex; align-items: baseline; gap: var(--gap); padding: 14px 16px; border-bottom: 1px solid var(--rule); }
header .name { font-family: var(--serif); font-size: var(--fs-name); }
header .label { font-size: var(--fs-label); text-transform: uppercase; letter-spacing: .08em; color: var(--quiet); }
main { flex: 1; display: grid; place-items: center; padding: 16px; }
main img { max-width: 100%; max-height: calc(100vh - 150px); display: block; background: #000; border: 1px solid var(--rule); }
main .closed { font-family: var(--mono); color: var(--quiet); font-size: var(--fs-body); text-align: center; padding: 40px; border: 1px solid var(--rule); }
main .closed b { color: var(--bad); font-weight: normal; }
footer { display: flex; flex-wrap: wrap; gap: 6px 20px; padding: 12px 16px; border-top: 1px solid var(--rule); font-family: var(--mono); font-size: var(--fs-meta); color: var(--quiet); }
footer .ok { color: var(--ok); } footer .bad { color: var(--bad); }
footer button { font: inherit; color: var(--fg); background: none; border: 1px solid var(--rule-strong); border-radius: var(--radius); padding: 10px 14px; min-height: 44px; cursor: pointer; }
footer button:active { opacity: .6; }
</style>
</head>
<body>
<header><span class="name">RaioEye</span><span class="label">the bed, live</span></header>
<main id="main"><img id="live" alt="the laser bed"></main>
<footer>
  <span id="laser">laser ·</span><span id="camera">camera ·</span><span id="armed"></span><span id="snap"></span>
  <button id="still">still</button>
</footer>
<script>
const $ = id => document.getElementById(id);
let closed = false, stalled = 0;
function openEye() {
  closed = false;
  $('main').innerHTML = '<img id="live" alt="the laser bed">';
  $('live').src = '/live.mjpg?' + Date.now();
}
function closeEye() {
  if (closed) return; closed = true;
  $('main').innerHTML = '<div class="closed"><b>laser armed</b><br>the eye is closed until the job ends</div>';
}
async function poll() {
  try {
    const s = await (await fetch('/state.json')).json();
    $('laser').textContent = 'laser ' + (s.laser ? '✓' : '✗'); $('laser').className = s.laser ? 'ok' : '';
    $('camera').textContent = 'camera ' + (s.camera ? '✓' : '✗') + ' ' + s.camera_name; $('camera').className = s.camera ? 'ok' : 'bad';
    $('armed').textContent = s.armed ? 'laser firing' : ''; $('armed').className = s.armed ? 'bad' : '';
    $('snap').textContent = s.snap_time ? 'last still ' + s.snap_time : '';
    if (s.armed && s.shutter_when_armed) closeEye();
    else if (closed) openEye();
    else if (!s.live) { if (++stalled >= 2) { stalled = 0; openEye(); } }   // the stream died (camera busy, replug): reconnect
    else stalled = 0;
  } catch (e) { $('camera').textContent = 'server ✗'; $('camera').className = 'bad'; }
}
$('still').onclick = async () => { const r = await fetch('/snap.jpg?full=1'); if (r.ok) window.open('/snap.jpg?cached=1&' + Date.now(), '_blank'); poll(); };
openEye(); poll(); setInterval(poll, 2000);
</script>
</body>
</html>
