<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Trilha">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>Trilha</title>
<style>
  /* Figma-dark chrome, deep green accent (Edson, 2026-08-25). The board itself
     keeps its warm FR4/copper look - only the chrome speaks Figma. */
  :root{
    --bg:#1E1E1E; --panel:#212121; --panel2:#2C2C2C; --rule:#383838;
    --ink:#FFFFFF; --ink2:#B3B3B3; --ink3:#7A7A7A;
    --cu:#D0865A; --fr4:#2A211B; --board:#33281f;
    --ok:#5DBE8A; --warn:#E0A552; --stop:#E0705C; --sel:#0E6B45; --selhi:#128a58;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font:12px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    touch-action:none;overscroll-behavior:none}
  #app{display:flex;height:100%}
  #stage{flex:1;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}

  /* ---- right panel: state only -------------------------------------- */
  #side{width:260px;flex:none;background:var(--panel);border-left:1px solid var(--rule);
    display:flex;flex-direction:column}
  #sideHead{display:flex;align-items:center;gap:8px;padding:10px 10px 6px 10px}
  #side h1{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink2);flex:1}
  /* green means "go to the burn session"; open, it is just a way back */
  button.burn{background:var(--sel);color:#fff}
  button.burn.on{background:var(--panel2);color:var(--ink2)}
  button.burn svg{stroke:none;fill:currentColor}
  button.burn.on svg{stroke:currentColor;fill:none}
  /* Bare icons floating on the canvas: the viewing tools, which change nothing
     about the board, and undo, which is one gesture rather than a mode. */
  #flipWrap{position:absolute;left:10px;bottom:18px;z-index:6;display:none;
    align-items:center;gap:7px}
  #flipWrap.show{display:flex}
  #sideTag{font:600 9px ui-monospace,monospace;letter-spacing:.09em;color:var(--ink2);
    background:var(--panel2);border-radius:4px;padding:4px 7px;white-space:nowrap;
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.75))}
  #canvasCtl{position:absolute;right:10px;bottom:18px;z-index:6;display:flex;gap:2px}
  #canvasCtl button, #canvasCtl button.on, button.bare, button.bare.on{background:none}
  #canvasCtl button, button.bare{color:var(--ink3);
    filter:drop-shadow(0 1px 3px rgba(0,0,0,.75))}
  #canvasCtl button.on{color:var(--ok)}
  #canvasCtl button:active, button.bare:active{color:var(--ink)}

  /* burn session */
  /* One weight for reading, one accent for meaning. The values carry no bold:
     they are already distinguished by colour, alignment and the mono figures. */
  .tag{font:500 9px ui-monospace,monospace;letter-spacing:.08em;color:var(--ok);
    background:rgba(93,190,138,.1);border-radius:4px;padding:3px 6px}
  /* sized to sit level with the net list, not to shout over it */
  .kv{display:flex;align-items:baseline;gap:10px;padding:2.5px 0;line-height:1.35}
  .kv b{flex:none;width:66px;font:400 10px ui-monospace,monospace;color:var(--ink3);
    white-space:nowrap}
  .kv span{flex:1;text-align:right;font:400 11px ui-monospace,monospace;
    color:var(--ink2);font-variant-numeric:tabular-nums}
  .kv span.bad{color:var(--stop)} .kv span.ok{color:var(--ok)}
  .kv.head span{color:var(--ink)}
  button.exp{width:100%;height:auto;justify-content:flex-start;gap:11px;
    padding:10px;margin-bottom:6px;background:var(--panel2);
    border:1px solid var(--rule);text-align:left}
  button.exp svg{width:15px;height:15px;flex:none;color:var(--ink3)}
  button.exp span{display:flex;flex-direction:column;gap:2px;min-width:0}
  button.exp b{font:500 11.5px -apple-system,sans-serif;letter-spacing:.01em}
  button.exp i{font:normal 9.5px/1.35 ui-monospace,monospace;color:var(--ink3)}
  button.exp:active{background:#3A3A3A}
  button.exp.busy{opacity:.5}
  button.exp.ok{border-color:var(--selhi)}
  .opt{display:flex;align-items:flex-start;gap:9px;padding:7px 8px;border-radius:7px;
    margin:0 -2px 2px}
  .opt:active{background:var(--panel2)}
  .opt input{accent-color:var(--selhi);width:14px;height:14px;flex:none;margin-top:2px}
  .opt span{display:flex;flex-direction:column;gap:3px;min-width:0}
  .opt b{font:500 11px -apple-system,sans-serif;color:var(--ink2)}
  .opt i{font:normal 9.5px/1.4 ui-monospace,monospace;color:var(--ink3)}
  .opt.sel{background:rgba(18,138,88,.1)}
  .opt.sel b{color:var(--ink)}
  #expSect{border-bottom:0}      /* nothing follows it, so no rule hanging below */
  #burnLog{padding:0 16px}
  #burnLog:empty{display:none}
  #burnLog pre{white-space:pre-wrap;font:400 10.5px/1.5 ui-monospace,monospace;
    color:var(--ink2);background:#191919;border:1px solid var(--rule);
    border-radius:6px;padding:10px;margin-bottom:12px;
    max-height:300px;overflow-y:auto;touch-action:pan-y}
  #burnLog .why{color:var(--stop);font:400 11px/1.5 ui-monospace,monospace;
    background:rgba(224,112,92,.08);border-left:2px solid var(--stop);
    border-radius:0 6px 6px 0;padding:9px 10px;margin:12px 0 8px}
  #burnLog .why b{font-weight:600;display:block;margin-bottom:3px}
  /* panels swap with the view: the sidebar always shows what you are doing */
  .panel{display:none;flex:1;min-height:0;flex-direction:column}
  .panel.show{display:flex}
  /* the burn panel is taller than the sidebar: it has to scroll, or the log
     that explains a refusal sits below the fold where nobody finds it */
  #panelBurn{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
  .sect{padding:12px 16px;border-bottom:1px solid var(--rule)}
  .lab{display:flex;align-items:center;font:500 10px/1 ui-monospace,monospace;
    letter-spacing:.12em;text-transform:uppercase;color:#6A6A6A;margin-bottom:10px}
  .spacer{flex:1}
  .toolrow{display:flex;gap:2px;align-items:center}
  .fields{display:flex;gap:8px;align-items:center}
  .f{display:flex;align-items:center;gap:6px;background:var(--panel2);
    border:1px solid var(--rule);border-radius:6px;padding:0 8px;height:30px;flex:1}
  .f i{font:600 10px ui-monospace,monospace;color:var(--ink3);font-style:normal;flex:none}
  .f input{width:100%;background:none;border:0;color:var(--ink);outline:none;
    font:600 12px ui-monospace,monospace;-webkit-user-select:text;user-select:text}
  .f input::-webkit-outer-spin-button,.f input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0}
  #bHoleSize{flex:1;height:30px;background:var(--panel2);color:var(--ink);
    border:1px solid var(--rule);border-radius:6px;padding:0 8px;
    font:600 12px ui-monospace,monospace}
  button.mini2{width:26px;height:22px;border-radius:5px;background:var(--panel2)}
  button.mini2 svg{width:13px;height:13px}
  button.del{width:30px;height:30px;background:var(--panel2);flex:none}
  button.del svg{width:14px;height:14px;stroke:var(--stop)}
  .hint{font:11px ui-monospace,monospace;color:var(--ink3);margin-top:8px}
  #holeList{max-height:150px;overflow-y:auto;touch-action:pan-y;margin-top:8px}
  .hrow{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:5px;
    font:600 11px ui-monospace,monospace;color:var(--ink2);cursor:pointer}
  .hrow:active{opacity:.6}
  .hrow.sel{background:rgba(18,138,88,.18);color:#fff;outline:1px solid var(--selhi)}
  .hrow .hd{color:var(--ink3)}
  #selSect{display:none}
  #selSect.show{display:block}
  #boardAlerts{overflow-y:auto;padding:8px 16px;touch-action:pan-y}
  #boardAlerts div{font-size:11px;padding:5px 0;color:var(--stop);cursor:pointer;
    border-bottom:1px dashed var(--rule)}
  #boardAlerts div::after{content:" \2192";color:var(--ink3)}
  #status{padding:2px 0 10px}
  .stat{display:flex;align-items:center;gap:10px;padding:4px 18px;
    font:600 12px/1 ui-monospace,monospace}
  .stat svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;opacity:.92;flex:none}
  .stat .ok{color:var(--ok)} .stat .bad{color:var(--stop)} .stat .warn{color:var(--warn)}
  #nets{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 10px;touch-action:pan-y}
  .net{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;margin:1px 0}
  .net .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .net .nm{font:600 12px ui-monospace,monospace}
  .net .pads{font-size:10px;color:var(--ink3);margin-top:1px}
  .net .st{margin-left:auto;font:700 12px ui-monospace,monospace;flex:none}
  .net.done .st{color:var(--ok)}
  .net.short{background:rgba(224,112,92,.12)} .net.short .st{color:var(--stop)}
  .net .st.todo{color:var(--ink3)}
  .net.focus{background:rgba(18,138,88,.18);outline:1px solid var(--selhi)}
  .net.dim{opacity:.35}
  #alerts{max-height:150px;overflow-y:auto;border-top:1px solid var(--rule);
    padding:8px 16px;touch-action:pan-y}
  #alerts div{font-size:11px;padding:5px 0;cursor:pointer;
    border-bottom:1px dashed var(--rule)}
  #alerts div:active{opacity:.6}
  #alerts div::after{content:" \2192";color:var(--ink3)}
  #alerts .short{color:var(--stop)} #alerts .gap{color:var(--warn)}

  /* ---- buttons: icon-only, Figma sizing ----------------------------- */
  button{background:transparent;color:var(--ink);border:0;border-radius:8px;
    width:36px;height:36px;display:flex;align-items:center;justify-content:center;
    flex:none;padding:0}
  button svg{width:20px;height:20px;stroke:currentColor;fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  button:active{background:#3A3A3A}
  button.on{background:var(--sel);color:#fff}
  button.mini{width:16px;border-radius:6px}
  button.mini svg{width:11px;height:11px}

  /* ---- floating islands --------------------------------------------- */
  #islands{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
    display:flex;gap:10px;z-index:6}
  .island{display:flex;align-items:center;gap:2px;background:var(--panel2);
    border:1px solid var(--rule);border-radius:13px;padding:4px;
    box-shadow:0 4px 14px rgba(0,0,0,.4)}

  /* ---- popovers ------------------------------------------------------ */
  .pop{position:absolute;bottom:70px;z-index:7;display:none;
    background:var(--panel2);border:1px solid var(--rule);border-radius:13px;
    padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  .pop.show{display:flex}
  #readout{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);z-index:6;
    display:none;background:var(--panel2);border:1px solid var(--rule);border-radius:8px;
    padding:5px 12px;font:600 12px ui-monospace,monospace;color:var(--ink);
    pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #readout.show{display:block}
  #wPop{flex-direction:column;gap:2px}
  #wPop button{width:56px;height:32px;gap:8px;justify-content:flex-start;padding:0 8px}
  #wPop .wdot{border-radius:50%;background:currentColor;flex:none}
  #wPop .wmm{font:600 10px ui-monospace,monospace;color:var(--ink2)}
  #wPop button.on .wmm{color:#fff}
  #smoothPop{flex-direction:column;align-items:center}
  #smooth{width:28px;height:132px;position:relative;touch-action:none}
  #smooth .track{position:absolute;top:0;bottom:0;left:12px;width:4px;
    border-radius:2px;background:var(--rule)}
  #smooth .fill{position:absolute;bottom:0;left:12px;width:4px;border-radius:2px;
    background:var(--selhi)}
  #smooth .knob{position:absolute;left:3px;width:22px;height:22px;border-radius:50%;
    background:var(--ink);border:2px solid var(--selhi);margin-top:-11px}

  /* ---- floating sidebar-restore button ------------------------------- */
  #sideShow{position:absolute;top:12px;right:12px;z-index:6;display:none;
    background:var(--panel2);border:1px solid var(--rule);border-radius:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.4)}
  #sideShow.show{display:flex}

  .dim3d{opacity:.35;pointer-events:none}
  #cv3{position:absolute;inset:0;width:100%;height:100%;touch-action:none;
    display:none;background:var(--bg)}
  #legend{position:absolute;left:12px;bottom:84px;z-index:5;display:none;
    background:rgba(30,30,30,.94);border:1px solid var(--rule);border-radius:13px;
    padding:12px 16px;
    display:none;grid-template-columns:12px 76px 1fr auto;
    column-gap:12px;row-gap:6px;align-items:baseline;
    font:11px/1.4 ui-monospace,monospace;color:var(--ink2)}
  #legend.show{display:grid}
  #legend i{width:10px;height:10px;border-radius:2px;align-self:center}
  #legend b{color:var(--ink);font-weight:700;white-space:nowrap}
  #legend .what{white-space:nowrap}
  #legend .dims{color:var(--ink3);white-space:nowrap;text-align:right;
    font-variant-numeric:tabular-nums}
  #toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);
    background:var(--panel2);border:1px solid var(--rule);border-radius:10px;
    padding:8px 14px;font-size:12px;line-height:1.4;opacity:0;
    transition:opacity .25s;pointer-events:none;max-width:min(560px, 80%);
    text-align:center}
  #toast.bad{border-color:var(--stop);color:#F6B9AE}
</style>
</head>
<body>
<!-- icon set: 24x24 strokes, Figma-weight -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-pen" viewBox="0 0 24 24"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-smooth" viewBox="0 0 24 24"><path d="M3 14c2.5-7 5-7 7.5 0s5 7 7.5 0"/></symbol>
  <symbol id="i-erase" viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="m5 9-3 3 3 3"/><path d="m9 5 3-3 3 3"/><path d="m15 19-3 3-3-3"/><path d="m19 9 3 3-3 3"/><path d="M2 12h20"/><path d="M12 2v20"/></symbol>
  <symbol id="i-board" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8" cy="16" r="1.4"/><circle cx="16" cy="8" r="1.4"/><path d="M9 15c4-1 2-6 6-6"/></symbol>
  <symbol id="i-route" viewBox="0 0 24 24"><circle cx="5" cy="19" r="2.2"/><circle cx="19" cy="5" r="2.2"/><path d="M7 18c7-2 3-10 10-12"/></symbol>
  <symbol id="i-cube" viewBox="0 0 24 24"><path d="M21 8v8l-9 5-9-5V8l9-5 9 5Z"/><path d="m3 8 9 5 9-5"/><path d="M12 22V13"/></symbol>
  <!-- the legend printed on the bare side: a footprint, pins ticked, pin 1 dotted -->
  <symbol id="i-silk" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="1.5"/><path d="M2 7h4M2 12h4M2 17h4M18 7h4M18 12h4M18 17h4"/><circle cx="9" cy="6.5" r="1.15"/></symbol>
  <!-- mirror about a vertical axis: what flipping the board actually does -->
  <symbol id="i-flip" viewBox="0 0 24 24"><path d="M12 2v20" stroke-dasharray="3 2.5"/><path d="M9 6 4 12l5 6V6Z"/><path d="m15 6 5 6-5 6V6Z"/></symbol>
  <symbol id="i-ghost" viewBox="0 0 24 24"><path d="M3 14c2.5-6 5-6 7.5 0s5 6 7.5 0" stroke-dasharray="2.6 2.8"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M15 4v16"/></symbol>
  <symbol id="i-net" viewBox="0 0 24 24"><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/><path d="M6.8 17.2 17.2 6.8"/></symbol>
  <symbol id="i-shape" viewBox="0 0 24 24"><path d="M4 8c0-2.5 3-5 8-5s8 3 8 6-2 4-2 6 1 2 1 4-3 2-7 2-8-2-8-5 2-4 1-6-1-1.5-1-2Z"/></symbol>
  <symbol id="i-rect" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="1.5"/></symbol>
  <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></symbol>
  <symbol id="i-hole" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21Z"/><path d="m7 9 2 2"/><path d="m11 5 2 2"/><path d="m11 13 2 2"/></symbol>
  <symbol id="i-short" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></symbol>
  <symbol id="i-gap" viewBox="0 0 24 24"><path d="M4 4v16"/><path d="M20 4v16"/><path d="m10 9-3 3 3 3"/><path d="m14 9 3 3-3 3"/></symbol>
  <symbol id="i-fit" viewBox="0 0 24 24"><path d="M3 8V5a2 2 0 0 1 2-2h3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M21 16v3a2 2 0 0 1-2 2h-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
  <!-- a real flame: pointed tip, full shoulders, an inner flame cut out of it -->
  <symbol id="i-fire" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C14.5 5.5 18.5 8.5 18.5 13A6.5 6.5 0 1 1 5.5 13C5.5 10.5 7 9.5 8 8.5C8.3 10 9.2 10.8 10 11C9.5 8 10.5 4.5 12 2ZM12 12.2C13 13.6 14.6 14.4 14.6 16.1A2.6 2.6 0 1 1 9.4 16.1C9.4 14.6 11 13.8 12 12.2Z"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3v13"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
</svg>
<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas><canvas id="cv3"></canvas>
    <div id="islands">
      <button id="undoB" class="bare" title="Undo"><svg><use href="#i-undo"/></svg></button>
      <div class="island" id="islDraw">
        <button id="toolDraw" class="on" title="Draw"><svg><use href="#i-pen"/></svg></button>
        <button id="wArrow" class="mini" title="Pencil size"><svg><use href="#i-chevron"/></svg></button>
        <button id="smoothB" title="Smoothness"><svg><use href="#i-smooth"/></svg></button>
        <button id="toolErase" title="Erase"><svg><use href="#i-erase"/></svg></button>
        <button id="toolMove" title="Move a component"><svg><use href="#i-move"/></svg></button>
      </div>
      <div class="island">
        <button id="viewBoard" title="Board view"><svg><use href="#i-shape"/></svg></button>
        <button id="viewDraw" class="on" title="Draw view"><svg><use href="#i-board"/></svg></button>
        <button id="viewSchem" title="Schematic \u2014 the printable legend"><svg><use href="#i-silk"/></svg></button>
        <button id="view3d" title="3D view"><svg><use href="#i-cube"/></svg></button>
      </div>
    </div>
    <div class="pop" id="wPop"></div>
    <div id="readout"></div>
    <div class="pop" id="smoothPop">
      <div id="smooth"><div class="track"></div><div class="fill"></div><div class="knob"></div></div>
    </div>
    <button id="sideShow" title="Show the panel"><svg><use href="#i-panel"/></svg></button>
    <!-- how you LOOK at the board, as opposed to how you change it -->
    <div id="canvasCtl">
      <button id="fitB" title="Fit the board to the screen"><svg><use href="#i-fit"/></svg></button>
      <button id="gridB" class="on" title="Grid"><svg><use href="#i-grid"/></svg></button>
      <button id="copperB" title="Copper: how it really looks"><svg><use href="#i-route"/></svg></button>
      <button id="autoB" class="on" title="Ghost autoroute"><svg><use href="#i-ghost"/></svg></button>
    </div>
    <!-- bottom-LEFT, opposite the viewing tools: which face of the board you
         are reading. Only the schematic view has two faces, so it lives here. -->
    <div id="flipWrap">
      <button id="flipB" class="bare" title="Flip the board over"><svg><use href="#i-flip"/></svg></button>
      <span id="sideTag">COPPER SIDE</span>
    </div>
    <div id="legend"></div>
    <div id="toast"></div>
  </div>
  <div id="side">
    <div id="sideHead">
      <button id="sideHide" title="Hide panel"><svg><use href="#i-panel"/></svg></button>
      <h1 id="sideTitle">Connections</h1>

    <div class="panel" id="panelDraw">

        <div class="stat"><svg><use href="#i-short"/></svg><span id="cShorts">–</span></div>

    <div class="panel" id="panelBoard">

          <button id="bShape" class="on" title="Draw the outline freehand"><svg><use href="#i-pen"/></svg></button>
          <button id="bRect" title="Rectangle"><svg><use href="#i-rect"/></svg></button>

      </div>

        <div class="lab">Laser recipe<span class="spacer"></span>
          <span class="tag">measured</span></div>
        <div id="burnRecipe"></div>

        <div class="lab">How the copper comes off</div>
        <label class="opt"><input type="radio" name="clearmode" value="clear" checked>
          <span><b>Copper full clear</b>
            <i>All copper off but traces and pads</i></span></label>
        <label class="opt"><input type="radio" name="clearmode" value="moat">
          <span><b>Minimal isolation clear</b>
            <i>0.5 mm ring only, rest stays as ground</i></span></label>

        <div class="lab">Export</div>
        <button class="exp" id="expLbrn">
          <svg><use href="#i-down"/></svg>

        </button>

        </button>

          <svg><use href="#i-down"/></svg>

        </button>

</div>
<script>
"use strict";
/* ============================ state ==================================== */
let B = null;                       // board data from /board
let strokes = [];                   // [{pts:[[x,y]...], w}]  mm, y-up
let moves = {};                     // {compName: [dx,dy]} mm — component repositions
let undoStack = [];
let view = {x: 0, y: 0, s: 8};      // world->screen: sx=(x-vx)*s, sy=(vy-y)*s
let drawW = 0.5, erase = false, showAuto = true, dirty = false;
let copperView = false;             // true = render as real copper on FR4
let smoothVal = 0.35;             // 0 = raw line, 1 = very smooth
let cur = null;                     // in-progress stroke pts
let eraseSession = null;            // strokes deleted during one erase gesture
let moveMode = false;               // Move button: pencil drags components
let dragComp = null;                // {c, sx, sy, m0} during a component drag
let focusNet = null;                // tap a net in the checklist: the rest greys
// ---- the board itself: outline drawn here WINS over circuit.json ----------
let boardMode = false;              // Board tool: the pencil shapes the object
let boardTool = "shape";            // shape | rect | circle | hole
let drawnOutline = null;            // [[x,y]...] authored here, null = tscircuit's
let boardHoles = [];                // [{x,y,d}] free holes placed here
let holeD = 3.2;                    // next hole diameter (M3 clearance)
let dragHole = null;                // {h, dx, dy} while sliding a placed hole
let selHole = null;                 // the hole the inspector is editing
let prim = null;                    // {x0,y0,x1,y1} while dragging a primitive
let showGrid = true;                // millimetre grid under everything
let burnOpen = false;               // the burn session owns the panel
let snap = false;                   // 0.5 mm grid while shaping the board
const SNAP = 0.5;
function sn(v){ return snap ? Math.round(v / SNAP) * SNAP : v; }
let marker = null;                  // {x,y} crosshair dropped by tapping an alert
let conn = null;                    // last connectivity result
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const DPR = window.devicePixelRatio || 1;

const PALETTE = ["#62A0EA","#8FBE6C","#E0A552","#D67BB8","#6FC7B4",
                 "#C7B45F","#9E86E8","#E08585","#6FB3C7","#B5C76F",
                 "#E89A6C","#85AEE0","#C78FD6","#7FC79A"];
function netColor(net){
  if (net === B.pour_net) return "#8a7a6a";
  let h = 0; for (const c of net) h = (h*31 + c.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

/* ===================== component moves ================================= */
// A move translates a component and ALL its pads. Strokes are never moved with
// it - the checklist unticks by itself when a pad leaves its drawn copper, and
// redrawing is the honest fix. Saved beside the strokes; the converter applies
// the same offsets so UI, converter and verifier see one geometry.
function padComp(p){ const i = p.name.indexOf("."); return i > 0 ? p.name.slice(0, i) : null; }
function applyMoves(){
  for (const p of B.pads){
    const m = moves[padComp(p)];
    p.x = p.bx + (m ? m[0] : 0); p.y = p.by + (m ? m[1] : 0);
  }
  for (const c of (B.comps || [])){
    const m = moves[c.name];
    c.x = c.bx + (m ? m[0] : 0); c.y = c.by + (m ? m[1] : 0);
  }
}
function compCorners(c){
  const r = (c.rot || 0) * Math.PI/180, ct = Math.cos(r), st = Math.sin(r);
  const w = Math.max(c.w, 2)/2, h = Math.max(c.h, 2)/2;
  return [[-w,-h],[w,-h],[w,h],[-w,h]]
    .map(([dx,dy]) => [c.x + dx*ct - dy*st, c.y + dx*st + dy*ct]);
}
/* ===================== the board as a drawn object ====================== */
function outlineNow(){ return drawnOutline || B.outline; }
function holesOwnedHere(){ return !!drawnOutline || boardHoles.length > 0; }
function primOutline(p){
  // rect and circle from one drag: corner to corner, or bbox-inscribed ellipse
  const x0 = Math.min(p.x0,p.x1), x1 = Math.max(p.x0,p.x1);
  const y0 = Math.min(p.y0,p.y1), y1 = Math.max(p.y0,p.y1);
  if (boardTool === "rect") return [[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
  const cx=(x0+x1)/2, cy=(y0+y1)/2, rx=(x1-x0)/2, ry=(y1-y0)/2, N=64;
  const out=[];
  for (let i=0;i<N;i++){
    const a = i*2*Math.PI/N;
    out.push([+(cx+rx*Math.cos(a)).toFixed(3), +(cy+ry*Math.sin(a)).toFixed(3)]);
  }
  return out;
}
function polyArea(p){
  let a = 0;
  for (let i=0;i<p.length;i++){
    const [x1,y1]=p[i], [x2,y2]=p[(i+1)%p.length];
    a += x1*y2 - x2*y1;
  }
  return a/2;
}
function polySize(p){
  const xs=p.map(q=>q[0]), ys=p.map(q=>q[1]);
  return [Math.max(...xs)-Math.min(...xs), Math.max(...ys)-Math.min(...ys)];
}
function setOutline(pts){
  // Weld the ends. A hand that travels all the way round finishes ON its own
  // start, and the implicit closing edge between two coincident points is
  // degenerate - it reads as the outline crossing itself. Drop the tail that
  // has already arrived.
  pts = pts.slice();
  while (pts.length > 3 &&
         Math.hypot(pts[pts.length-1][0]-pts[0][0],
                    pts[pts.length-1][1]-pts[0][1]) < 0.6) pts.pop();
  // keep a consistent winding so the cutout polygon never depends on which way
  // the hand happened to travel
  if (polyArea(pts) < 0) pts = pts.slice().reverse();
  undoStack.push({op:"outline", prev: drawnOutline});
  drawnOutline = pts.map(q=>[+q[0].toFixed(3), +q[1].toFixed(3)]);
  const [w,h] = polySize(drawnOutline);
  markDirty(); analyze(); draw();
  toast(`Board ${w.toFixed(1)} × ${h.toFixed(1)} mm`);
}
function holeAt(wx, wy){
  for (let i=boardHoles.length-1;i>=0;i--){
    const h = boardHoles[i];
    if (Math.hypot(wx-h.x, wy-h.y) < h.d/2 + 0.8) return h;
  }
  return null;
}
function showReadout(txt){
  const el = document.getElementById("readout");
  if (txt === null){ el.classList.remove("show"); return; }
  el.textContent = txt; el.classList.add("show");
}

function compAt(wx, wy){
  for (const c of (B.comps || [])){
    const r = (c.rot || 0) * Math.PI/180;
    const dx = wx - c.x, dy = wy - c.y;
    const lx = dx*Math.cos(-r) - dy*Math.sin(-r), ly = dx*Math.sin(-r) + dy*Math.cos(-r);
    if (Math.abs(lx) <= Math.max(c.w, 2)/2 + 0.6 &&
        Math.abs(ly) <= Math.max(c.h, 2)/2 + 0.6) return c;
  }
  return null;
}

/* ============================ geometry ================================= */
function d2(ax,ay,bx,by){ const dx=ax-bx, dy=ay-by; return dx*dx+dy*dy; }
function distPtSeg(px,py, ax,ay, bx,by){
  const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy;
  let t = L2 ? ((px-ax)*dx+(py-ay)*dy)/L2 : 0;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px-(ax+t*dx), py-(ay+t*dy));
}
function distPtStroke(px,py, s){
  let m = 1e9;
  for (let i=0;i+1<s.pts.length;i++)
    m = Math.min(m, distPtSeg(px,py, s.pts[i][0],s.pts[i][1], s.pts[i+1][0],s.pts[i+1][1]));
  return m;
}
function ccw(px,py,qx,qy,rx,ry){ return (qx-px)*(ry-py)-(qy-py)*(rx-px); }
function segSeg(ax,ay,bx,by, cx,cy,dx,dy){
  // true segment-segment distance. Vertex sampling alone misses two long
  // segments crossing near mid-span - that blindness let real welds through.
  const d1=ccw(cx,cy,dx,dy,ax,ay), d2=ccw(cx,cy,dx,dy,bx,by),
        d3=ccw(ax,ay,bx,by,cx,cy), d4=ccw(ax,ay,bx,by,dx,dy);
  if (((d1>0)!==(d2>0)) && ((d3>0)!==(d4>0))) return 0;
  return Math.min(distPtSeg(ax,ay,cx,cy,dx,dy), distPtSeg(bx,by,cx,cy,dx,dy),
                  distPtSeg(cx,cy,ax,ay,bx,by), distPtSeg(dx,dy,ax,ay,bx,by));
}
function distStrokes(a, b){       // centreline distance between two polylines
  let m = 1e9;
  for (let i=0;i+1<a.pts.length;i++)
    for (let j=0;j+1<b.pts.length;j++)
      m = Math.min(m, segSeg(a.pts[i][0],a.pts[i][1], a.pts[i+1][0],a.pts[i+1][1],
                             b.pts[j][0],b.pts[j][1], b.pts[j+1][0],b.pts[j+1][1]));
  return m;
}
function rdp(pts, tol){
  if (pts.length < 3) return pts;
  const keep = new Array(pts.length).fill(false);
  keep[0] = keep[pts.length-1] = true;
  const st = [[0, pts.length-1]];
  while (st.length){
    const [i,j] = st.pop();
    let best = -1, bi = -1;
    for (let k=i+1;k<j;k++){
      const d = distPtSeg(pts[k][0],pts[k][1], pts[i][0],pts[i][1], pts[j][0],pts[j][1]);
      if (d > best){ best = d; bi = k; }
    }
    if (best > tol){ keep[bi]=true; st.push([i,bi],[bi,j]); }
  }
  return pts.filter((_,k)=>keep[k]);
}
function smooth(pts){              // one Chaikin pass keeps it organic, kills jitter
  if (pts.length < 3) return pts;
  const out = [pts[0]];
  for (let i=0;i+1<pts.length;i++){
    const [ax,ay]=pts[i],[bx,by]=pts[i+1];
    out.push([ax*0.75+bx*0.25, ay*0.75+by*0.25], [ax*0.25+bx*0.75, ay*0.25+by*0.75]);
  }
  out.push(pts[pts.length-1]);
  return out;
}

/* ===================== connectivity + checks =========================== */
function segRect(ax,ay,bx,by, cx,cy,hw,hh){
  // distance from segment to axis-aligned rect. Circle models under-reach a
  // square pad's corner by 0.41r - more than the clearance floor.
  if ((Math.abs(ax-cx)<=hw && Math.abs(ay-cy)<=hh) ||
      (Math.abs(bx-cx)<=hw && Math.abs(by-cy)<=hh)) return 0;
  const co = [[cx-hw,cy-hh],[cx+hw,cy-hh],[cx+hw,cy+hh],[cx-hw,cy+hh]];
  let m = 1e18;
  for (let i=0;i<4;i++){
    const [x1,y1]=co[i], [x2,y2]=co[(i+1)%4];
    m = Math.min(m, segSeg(ax,ay,bx,by, x1,y1,x2,y2));
  }
  return m;
}
function strokePadSurf(s, p){
  if (p.shape === "rect"){
    const hw=(p.pad_w||p.d)/2, hh=(p.pad_h||p.d)/2;
    let m = 1e18;
    for (let i=0;i+1<s.pts.length;i++)
      m = Math.min(m, segRect(s.pts[i][0],s.pts[i][1],s.pts[i+1][0],s.pts[i+1][1],
                              p.x,p.y,hw,hh));
    return m - s.w/2;
  }
  return distPtStroke(p.x,p.y,s) - s.w/2 - Math.max(p.d, p.pad_w||0, p.pad_h||0)/2;
}

function analyze(){
  const N = B.pads.length + strokes.length;
  const par = Array.from({length:N}, (_,i)=>i);
  const find = a => { while (par[a]!==a){ par[a]=par[par[a]]; a=par[a]; } return a; };
  const uni = (a,b) => { a=find(a); b=find(b); if (a!==b) par[a]=b; };

  // pads of the same net are pre-joined (that is what "same net" means),
  // pour-net pads doubly so
  const byNet = {};
  B.pads.forEach((p,i)=>{ if (p.net) (byNet[p.net] ||= []).push(i); });
  for (const net in byNet){
    const l = byNet[net];
    for (let i=1;i<l.length;i++) uni(l[0], l[i]);
  }
  // stroke-pad and stroke-stroke contact
  const touches = strokes.map(()=>new Set());
  strokes.forEach((s, si)=>{
    B.pads.forEach((p, pi)=>{
      // segment-accurate, not vertex-only: a segment sweeping past a pad
      // mid-span must count as touching it
      if (strokePadSurf(s, p) <= 0.08){
        uni(B.pads.length+si, pi); touches[si].add(pi);
      }
    });
  });
  for (let i=0;i<strokes.length;i++)
    for (let j=i+1;j<strokes.length;j++)
      if (distStrokes(strokes[i], strokes[j]) <= (strokes[i].w+strokes[j].w)/2 + 0.05)
        uni(B.pads.length+i, B.pads.length+j);

  // nets present in each group
  const groupNets = {};
  B.pads.forEach((p,i)=>{ if (p.net) (groupNets[find(i)] ||= new Set()).add(p.net); });

  const shorts = [];               // {nets:[..], strokeIdx?}
  for (const g in groupNets)
    if (groupNets[g].size > 1) shorts.push([...groupNets[g]]);

  const strokeState = strokes.map((s,si)=>{
    const g = find(B.pads.length+si);
    const nets = groupNets[g] ? [...groupNets[g]] : [];
    return { nets, short: nets.length>1, floating: nets.length===0 };
  });

  // net completion: every pad of the net in one group AND that group holds a stroke
  // path between them (pads are pre-joined logically, so completion = every pad is
  // reachable from every other through drawn copper). Test pairwise via a second
  // union-find that does NOT pre-join same-net pads.
  const par2 = Array.from({length:N}, (_,i)=>i);
  const find2 = a => { while (par2[a]!==a){ par2[a]=par2[par2[a]]; a=par2[a]; } return a; };
  const uni2 = (a,b) => { a=find2(a); b=find2(b); if (a!==b) par2[a]=b; };
  strokes.forEach((s,si)=>{ for (const pi of touches[si]) uni2(B.pads.length+si, pi); });
  for (let i=0;i<strokes.length;i++)
    for (let j=i+1;j<strokes.length;j++)
      if (distStrokes(strokes[i], strokes[j]) <= (strokes[i].w+strokes[j].w)/2 + 0.05)
        uni2(B.pads.length+i, B.pads.length+j);

  const netDone = {};
  for (const net in B.nets){
    if (net === B.pour_net){ netDone[net] = true; continue; }
    const l = B.nets[net];
    netDone[net] = l.every(i => find2(i) === find2(l[0])) &&
      (l.length < 2 || l.some(i => find2(i) !== i || strokes.some((s,si)=>touches[si].has(i))));
  }

  // clearance: stroke surface vs other-net copper surface
  const gaps = [];
  strokes.forEach((s, si)=>{
    const myNets = strokeState[si].nets;
    if (myNets.length !== 1) return;      // floating or already shorted
    const my = myNets[0];
    B.pads.forEach(p=>{
      if (!p.net || p.net === my) return;
      const surf = strokePadSurf(s, p);
      if (surf < B.min_gap && surf > -0.01){
        let bq = s.pts[0], bd = 1e18;
        for (const q of s.pts){
          const dd = d2(q[0],q[1], p.x,p.y);
          if (dd < bd){ bd = dd; bq = q; }
        }
        gaps.push({si, x:(bq[0]+p.x)/2, y:(bq[1]+p.y)/2,
                   msg:`${my} runs ${surf.toFixed(2)} mm from ${p.name} (${p.net})`});
      }
    });
    strokes.forEach((o, oi)=>{
      if (oi <= si) return;
      const oNets = strokeState[oi].nets;
      if (oNets.length !== 1 || oNets[0] === my) return;
      const surf = distStrokes(s, o) - s.w/2 - o.w/2;
      if (surf < B.min_gap && surf > -0.01){
        let loc = s.pts[0], bd = 1e18;
        for (const q of s.pts){
          const dd = distPtStroke(q[0], q[1], o);
          if (dd < bd){ bd = dd; loc = q; }
        }
        gaps.push({si, oi, x:loc[0], y:loc[1],
                   msg:`${my} runs ${surf.toFixed(2)} mm from ${oNets[0]}`});
      }
    });
  });

  // ---- ornament fusion: what the LASER will weld, not what logically touches.
  // Copper closer than FUSE mm (kerf pullback both sides + margin) gets physically
  // merged on the real board. An ornament fusing into ONE net becomes that net's
  // decoration - fine. An ornament chain reaching TWO nets is a manufactured short
  // that no logical check can see. Mirror of the converter's net_fusions().
  const FUSE = 0.17;
  const par3 = Array.from({length:N}, (_,i)=>i);
  const find3 = a => { while (par3[a]!==a){ par3[a]=par3[par3[a]]; a=par3[a]; } return a; };
  const uni3 = (a,b) => { a=find3(a); b=find3(b); if (a!==b) par3[a]=b; };
  strokes.forEach((s, si)=>{
    B.pads.forEach((p, pi)=>{
      if (strokePadSurf(s, p) <= FUSE) uni3(B.pads.length+si, pi);
    });
  });
  for (let i=0;i<strokes.length;i++)
    for (let j=i+1;j<strokes.length;j++)
      if (distStrokes(strokes[i], strokes[j]) <= (strokes[i].w+strokes[j].w)/2 + FUSE)
        uni3(B.pads.length+i, B.pads.length+j);
  const fuseNets = {};
  B.pads.forEach((p,i)=>{ if (p.net) (fuseNets[find3(i)] ||= new Set()).add(p.net); });
  const fusions = [];
  strokes.forEach((s, si)=>{
    const st = strokeState[si];
    const fn = fuseNets[find3(B.pads.length+si)];
    if (st.floating && fn){
      if (fn.size > 1){ st.fuseShort = [...fn]; }
      else { st.fusedNet = [...fn][0]; }
    }
  });
  const seen = new Set();
  strokes.forEach((s, si)=>{
    const st = strokeState[si];
    if (st.fuseShort){
      const key = st.fuseShort.join("+");
      if (!seen.has(key)){ seen.add(key); fusions.push(st.fuseShort); }
    }
  });

  // ---- locations for alerts: closest approach between the first two nets'
  //      copper. A bridge belongs to both sets, so the argmin lands on it.
  function effNets(si){
    const st = strokeState[si];
    if (st.nets.length) return st.nets;
    if (st.fuseShort) return st.fuseShort;
    if (st.fusedNet) return [st.fusedNet];
    return [];
  }
  function samplesOf(si){
    const out = [], pts = strokes[si].pts, STEP = 0.5;
    for (let i=0;i+1<pts.length;i++){
      const [ax,ay]=pts[i],[bx,by]=pts[i+1];
      const L = Math.hypot(bx-ax, by-ay), n = Math.max(1, Math.ceil(L/STEP));
      for (let k=0;k<=n;k++) out.push([ax+(bx-ax)*k/n, ay+(by-ay)*k/n]);
    }
    return out;
  }
  function netSamples(net){
    let out = [];
    B.pads.forEach(p=>{
      if (p.net !== net) return;
      out.push([p.x, p.y]);
      const hw = (p.pad_w||p.d)/2, hh = (p.pad_h||p.d)/2;
      // boundary points so alert locations land at the contact, not the centre
      out.push([p.x-hw, p.y-hh], [p.x+hw, p.y-hh], [p.x+hw, p.y+hh], [p.x-hw, p.y+hh],
               [p.x-hw, p.y], [p.x+hw, p.y], [p.x, p.y-hh], [p.x, p.y+hh]);
    });
    strokes.forEach((s,si)=>{ if (effNets(si).includes(net)) out = out.concat(samplesOf(si)); });
    if (out.length > 1400) out = out.filter((_,i)=> i % Math.ceil(out.length/1400) === 0);
    return out;
  }
  function closestBetween(nA, nB){
    const A = netSamples(nA), Bs = netSamples(nB);
    let best = 1e18, loc = null;
    for (const a of A) for (const b of Bs){
      const dd = d2(a[0],a[1], b[0],b[1]);
      if (dd < best){ best = dd; loc = [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
    }
    return loc;
  }
  const shortLocs = shorts.map(g => closestBetween(g[0], g[1]));
  const fusionLocs = fusions.map(g => closestBetween(g[0], g[1]));

  conn = { strokeState, netDone, shorts, shortLocs, gaps, fusions, fusionLocs,
           board: boardCheck() };
  renderSide();
  renderBoardPanel();
  renderBurn();
}

/* The board checked as an OBJECT, live. Mirrors verify.check_board(), which is
   what actually gates the laser file - this is the fast warning, not the truth. */
const BOARD_MARGIN = 0.5, EDGE_WEB = 1.0;
function ptInPoly(px, py, poly){
  let inside = false;
  for (let i=0;i<poly.length;i++){
    const [x1,y1] = poly[i], [x2,y2] = poly[(i+1)%poly.length];
    if ((y1 > py) !== (y2 > py)){
      const xin = x1 + (py - y1) * (x2 - x1) / (y2 - y1);
      if (px < xin) inside = !inside;
    }
  }
  return inside;
}
function distToPoly(px, py, poly){
  let m = 1e9;
  for (let i=0;i<poly.length;i++){
    const [x1,y1] = poly[i], [x2,y2] = poly[(i+1)%poly.length];
    m = Math.min(m, distPtSeg(px,py,x1,y1,x2,y2));
  }
  return m;
}
function boardCheck(){
  const out = [];
  const ol = outlineNow();
  if (!ol || ol.length < 3) return out;
  // PROPER crossing only, exactly as verify._seg_hits does it. A zero DISTANCE
  // is not a crossing: neighbouring segments legitimately touch at their shared
  // vertex, and treating that as a fault condemns every closed shape.
  for (let i=0;i<ol.length && !out.length;i++){
    const [ax,ay]=ol[i], [bx,by]=ol[(i+1)%ol.length];
    for (let j=i+1;j<ol.length;j++){
      if (j===i || (j+1)%ol.length===i || (i+1)%ol.length===j) continue;
      const [cx,cy]=ol[j], [dx,dy]=ol[(j+1)%ol.length];
      const d1=ccw(cx,cy,dx,dy,ax,ay), d2v=ccw(cx,cy,dx,dy,bx,by),
            d3=ccw(ax,ay,bx,by,cx,cy), d4=ccw(ax,ay,bx,by,dx,dy);
      if (((d1>0)!==(d2v>0)) && ((d3>0)!==(d4>0))){
        out.push({msg:"outline crosses itself", x:ax, y:ay});
        break;
      }
    }
  }
  for (const p of B.pads){
    const r = Math.max(p.d, p.pad_w||0, p.pad_h||0)/2;
    if (!ptInPoly(p.x, p.y, ol))
      out.push({msg:`pad ${p.name} is off the board`, x:p.x, y:p.y});
    else if (distToPoly(p.x, p.y, ol) - r < BOARD_MARGIN)
      out.push({msg:`pad ${p.name} is too close to the edge`, x:p.x, y:p.y});
  }
  strokes.forEach(s=>{
    for (const [qx,qy] of s.pts){
      if (!ptInPoly(qx, qy, ol)){
        out.push({msg:"a trace leaves the board", x:qx, y:qy}); return;
      }
      if (distToPoly(qx, qy, ol) - s.w/2 < BOARD_MARGIN){
        out.push({msg:"a trace runs off the edge", x:qx, y:qy}); return;
      }
    }
  });
  for (const h of (holesOwnedHere() ? boardHoles : B.holes)){
    const hr = h.d/2;
    if (!ptInPoly(h.x, h.y, ol)){
      out.push({msg:"hole is off the board", x:h.x, y:h.y}); continue;
    }
    if (distToPoly(h.x, h.y, ol) - hr < EDGE_WEB)
      out.push({msg:`hole leaves a thin web to the edge`, x:h.x, y:h.y});
    for (const p of B.pads){
      const g = Math.hypot(h.x-p.x, h.y-p.y) - hr - Math.max(p.d, p.pad_w||0, p.pad_h||0)/2;
      if (g < B.min_gap){
        out.push({msg:`hole is ${g.toFixed(2)} mm from pad ${p.name}`, x:h.x, y:h.y});
        break;
      }
    }
    for (const s of strokes){
      const g = distPtStroke(h.x, h.y, s) - hr - s.w/2;
      if (g < B.min_gap){
        out.push({msg:`hole is ${g.toFixed(2)} mm from a trace`, x:h.x, y:h.y});
        break;
      }
    }
  }
  return out;
}

/* ============================ rendering ================================ */
function resize(){
  cv.width = cv.clientWidth * DPR; cv.height = cv.clientHeight * DPR;
  draw();
}
function W2S(x,y){ return [(x-view.x)*view.s*DPR, (view.y-y)*view.s*DPR]; }
function S2W(sx,sy){ return [sx/DPR/view.s + view.x, view.y - sy/DPR/view.s]; }

function poly(pts, close){
  ctx.beginPath();
  const [x0,y0] = W2S(pts[0][0], pts[0][1]);
  ctx.moveTo(x0,y0);
  for (let i=1;i<pts.length;i++){ const [x,y]=W2S(pts[i][0],pts[i][1]); ctx.lineTo(x,y); }
  if (close) ctx.closePath();
}
function draw(){
  // the schematic view shares the canvas, the camera and every pan/zoom path;
  // only what gets painted differs
  if (curView === "schem") return drawSchem();
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  ctx.clearRect(0,0,cv.width,cv.height);
  if (!B) return;
  const px = mm => mm*view.s*DPR;

  // millimetre grid, so the eye has a scale before any number is read.
  // 1 mm minor / 10 mm major, each fading in only once it is legible.
  if (showGrid && !copperView){
    const [wx0, wy1] = S2W(0, 0), [wx1, wy0] = S2W(cv.width, cv.height);
    for (const [step, alpha] of [[1, 0.05], [10, 0.13]]){
      const sp = px(step);
      if (sp < 7) continue;                       // too dense to read: skip it
      ctx.strokeStyle = `rgba(255,255,255,${boardMode ? alpha*1.6 : alpha})`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = Math.ceil(wx0/step)*step; x <= wx1; x += step){
        const sx = Math.round(W2S(x, 0)[0]) + 0.5;
        ctx.moveTo(sx, 0); ctx.lineTo(sx, cv.height);
      }
      for (let y = Math.ceil(wy0/step)*step; y <= wy1; y += step){
        const sy = Math.round(W2S(0, y)[1]) + 0.5;
        ctx.moveTo(0, sy); ctx.lineTo(cv.width, sy);
      }
      ctx.stroke();
    }
  }

  // board. In board mode the copper fades to a whisper so the OBJECT is what
  // you see: outline, its holes, and the component holes. That is the filter -
  // done by context, not by another global toggle.
  const shaping = boardMode && !copperView;
  poly(outlineNow(), true); ctx.fillStyle = C("--board"); ctx.fill();
  ctx.lineWidth = px(shaping ? 0.5 : 0.3);
  ctx.strokeStyle = shaping ? C("--selhi") : "#0d0a08";
  ctx.stroke();
  if (shaping){
    // the outline's own vertices, so a drawn shape can be read as geometry
    const ol = outlineNow();
    if (drawnOutline && ol.length < 40){
      ctx.fillStyle = C("--selhi");
      for (const [vx,vy] of ol){
        const [sx,sy] = W2S(vx,vy);
        ctx.beginPath(); ctx.arc(sx,sy,2.5*DPR,0,7); ctx.fill();
      }
    }
  }

  // autoroute ghost, coloured by net so it works as a routing guide.
  // (hidden entirely in copper view - the real board has no ghosts)
  // Dashed so a ghost is never mistaken for drawn copper. A ghost is a PROPOSAL,
  // not an obstacle: checks only apply between drawn strokes. To keep the promise
  // readable, ghosts of nets that are already complete disappear - every dotted
  // line still visible means "this corridor is still owed to an undrawn net".
  if (shaping) ctx.globalAlpha = 0.16;      // copper recedes while shaping
  if (showAuto && !copperView && !shaping){
    // hairline, fine dash: a ghost should whisper. px(0.3) with long dashes read
    // as clutter next to real 0.3 mm copper (Edson, 2026-08-25).
    ctx.lineWidth = Math.max(0.8*DPR, px(0.15)); ctx.lineCap = ctx.lineJoin = "round";
    ctx.setLineDash([px(0.8), px(0.7)]);
    ctx.globalAlpha = 0.38;
    for (const t of B.auto){
      if (t.net === B.pour_net) continue;                    // pour: never drawn
      if (conn && t.net && conn.netDone[t.net]) continue;    // finished: ghost gone
      if (focusNet && t.net !== focusNet) continue;          // focus: only its ghost
      ctx.strokeStyle = t.net ? netColor(t.net) : "rgba(220,200,180,0.5)";
      poly(t.pts); ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }

  // mounting holes: circuit.json's, unless this board authored its own
  // Authoring the board means owning its free holes: circuit.json's belonged to
  // the old rectangle. Matches apply_board(), which drops them the same way.
  const holesNow = holesOwnedHere() ? boardHoles : B.holes;
  ctx.globalAlpha = 1;                       // holes belong to the object, never faded
  for (const h of holesNow){
    const [x,y]=W2S(h.x,h.y);
    ctx.beginPath(); ctx.arc(x,y,px(h.d/2),0,7);
    ctx.fillStyle = C("--bg"); ctx.fill();
    ctx.lineWidth = px(shaping ? 0.25 : 0.2);
    ctx.strokeStyle = shaping ? C("--selhi") : "#0d0a08"; ctx.stroke();
    if (h === selHole && shaping){
      ctx.beginPath(); ctx.arc(x, y, px(h.d/2) + 5*DPR, 0, 7);
      ctx.lineWidth = 2*DPR; ctx.strokeStyle = C("--selhi"); ctx.stroke();
    }
    if (shaping && view.s > 4){
      ctx.font = `600 ${10*DPR}px ui-monospace,monospace`;
      ctx.fillStyle = h === selHole ? "#fff" : "rgba(239,231,220,.75)";
      ctx.fillText("⌀" + h.d.toFixed(1), x + px(h.d/2) + 7*DPR, y - 3*DPR);
    }
  }
  if (shaping) ctx.globalAlpha = 0.16;

  // strokes
  strokes.forEach((s, si)=>{
    const st = conn ? conn.strokeState[si] : null;
    let col = "#c9b9a8";
    if (copperView){ col = C("--cu"); }
    else if (st){
      if (st.short) col = C("--stop");
      else if (st.fuseShort) col = C("--stop");          // laser will weld it to 2+ nets
      else if (st.fusedNet) col = netColor(st.fusedNet); // ornament adopted by a net
      else if (st.floating) col = "#8a8075";
      else col = netColor(st.nets[0]);
      // focus mode greys every stroke not on the focused net - shorts stay red,
      // a short is never allowed to hide
      if (focusNet && !st.short && !st.fuseShort){
        const en = st.nets.length ? st.nets : (st.fusedNet ? [st.fusedNet] : []);
        if (!en.includes(focusNet)) col = "#4e463f";
      }
    }
    ctx.lineWidth = px(s.w); ctx.lineCap = ctx.lineJoin = "round";
    ctx.strokeStyle = col;
    poly(s.pts); ctx.stroke();
    if (!copperView && conn && conn.gaps.some(g=>g.si===si || g.oi===si)){
      ctx.lineWidth = px(s.w) + 4*DPR; ctx.strokeStyle = "rgba(224,165,82,.35)";
      poly(s.pts); ctx.stroke();
    }
  });

  ctx.globalAlpha = 1;

  // live stroke — an outline in progress draws in the accent, a trace in ink
  if (cur && cur.length > 1){
    if (boardMode){
      ctx.lineWidth = Math.max(1.5*DPR, px(0.4)); ctx.setLineDash([px(1), px(0.8)]);
      ctx.strokeStyle = C("--selhi");
      poly(cur); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.lineWidth = px(drawW); ctx.lineCap = ctx.lineJoin = "round";
      ctx.strokeStyle = "rgba(239,231,220,.9)";
      poly(cur); ctx.stroke();
    }
  }
  // primitive being dragged out
  if (prim){
    ctx.lineWidth = Math.max(1.5*DPR, px(0.4)); ctx.setLineDash([px(1), px(0.8)]);
    ctx.strokeStyle = C("--selhi");
    poly(primOutline(prim), true); ctx.stroke(); ctx.setLineDash([]);
  }

  // crosshair from a tapped alert
  if (marker){
    const [mx,my] = W2S(marker.x, marker.y);
    ctx.strokeStyle = C("--stop"); ctx.lineWidth = 1.6*DPR;
    for (const rr of [px(1.2), px(2.2)]){
      ctx.beginPath(); ctx.arc(mx,my,rr,0,7); ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(mx-px(3.2),my); ctx.lineTo(mx-px(1.6),my);
    ctx.moveTo(mx+px(1.6),my); ctx.lineTo(mx+px(3.2),my);
    ctx.moveTo(mx,my-px(3.2)); ctx.lineTo(mx,my-px(1.6));
    ctx.moveTo(mx,my+px(1.6)); ctx.lineTo(mx,my+px(3.2));
    ctx.stroke();
  }

  // In board view a pad is not copper you care about - it is a COMPONENT HOLE.
  // Draw the drill and a hairline ring, nothing else: no net colours, no names,
  // no completion rings. What is left on screen is the object.
  if (shaping){
    for (const p of B.pads){
      const [x,y] = W2S(p.x, p.y);
      ctx.beginPath(); ctx.arc(x, y, Math.max(1.2*DPR, px(p.d/2)), 0, 7);
      ctx.fillStyle = "#241c16"; ctx.fill();
      ctx.lineWidth = 1*DPR; ctx.strokeStyle = "rgba(208,134,90,.35)"; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, Math.max(1*DPR, px(p.d/5)), 0, 7);
      ctx.fillStyle = "#120e0b"; ctx.fill();
    }
    return;          // nothing below this belongs to shaping the object
  }

  // pads on top
  const zoomed = view.s > 6;
  for (const p of B.pads){
    const [x,y]=W2S(p.x,p.y);
    const isPour = p.net === B.pour_net;
    const done = conn && p.net && conn.netDone[p.net];
    const dimmed = focusNet && !copperView && p.net !== focusNet;
    const r = px(Math.max(p.d, p.pad_w||0)/2);
    // Draw the pad's TRUE footprint. Square pads were rendered as circles until
    // 2026-08-23, hiding the corner - which reaches 0.41r beyond the circle and
    // was exactly where an "invisible" short lived.
    const isRect = p.shape === "rect";
    const hw = px((p.pad_w||p.d)/2), hh = px((p.pad_h||p.d)/2);
    function padPath(grow){
      ctx.beginPath();
      if (isRect) ctx.rect(x-hw-grow, y-hh-grow, 2*(hw+grow), 2*(hh+grow));
      else ctx.arc(x,y,r+grow,0,7);
    }
    padPath(0);
    ctx.fillStyle = dimmed ? "#57493d" : isPour ? "#6a5a4c" : C("--cu"); ctx.fill();
    if (!copperView){
      ctx.lineWidth = Math.max(1.2*DPR, px(0.12));
      ctx.strokeStyle = dimmed ? "#3a322b"
        : p.net ? (isPour ? "#4a3e33" : netColor(p.net)) : "#555";
      ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(x,y,Math.max(1.5*DPR, px(p.d/4)),0,7);
    ctx.fillStyle = "#120e0b"; ctx.fill();
    if (done && !isPour && !copperView && !dimmed){
      padPath(2.5*DPR);
      ctx.lineWidth = 1.6*DPR; ctx.strokeStyle = C("--ok"); ctx.stroke();
    }
    if (zoomed && p.net && !copperView && !dimmed){
      ctx.font = `${10*DPR}px ui-monospace,monospace`;
      ctx.fillStyle = "rgba(239,231,220,.55)";
      ctx.fillText(p.name, x + r + 3*DPR, y - 3*DPR);
    }
  }

  // component handles: only in Move mode. The rect is what the Pencil grabs.
  if (moveMode && !copperView){
    for (const c of (B.comps||[])){
      const cor = compCorners(c);
      poly(cor, true);
      ctx.fillStyle = "rgba(111,179,199,.10)"; ctx.fill();
      ctx.lineWidth = 1.4*DPR;
      ctx.strokeStyle = moves[c.name] ? "rgba(224,165,82,.9)" : "rgba(111,179,199,.8)";
      ctx.stroke();
      const [lx,ly] = W2S(c.x, c.y);
      ctx.font = `700 ${11*DPR}px ui-monospace,monospace`;
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(239,231,220,.9)";
      ctx.fillText(c.name + (moves[c.name]
        ? ` ${moves[c.name][0].toFixed(1)},${moves[c.name][1].toFixed(1)}` : ""), lx, ly);
      ctx.textAlign = "left";
    }
  }
}

/* ============================ side panel =============================== */
function renderSide(){
  const nets = Object.keys(B.nets).filter(n=>n!==B.pour_net).sort();
  const doneN = nets.filter(n=>conn.netDone[n]).length;
  const el = document.getElementById("nets");
  el.innerHTML = "";
  for (const n of nets){
    const done = conn.netDone[n];
    const inShort = conn.shorts.some(s=>s.includes(n));
    const div = document.createElement("div");
    div.className = "net" + (inShort ? " short" : done ? " done" : "")
      + (focusNet === n ? " focus" : focusNet ? " dim" : "");
    const padNames = B.nets[n].map(i=>B.pads[i].name).join("  ");
    div.innerHTML = `<span class="dot" style="background:${netColor(n)}"></span>
      <span><div class="nm">${n}</div><div class="pads">${padNames}</div></span>
      <span class="st ${done?"":"todo"}">${inShort ? "SHORT" : done ? "✓" : "·"}</span>`;
    // tap = focus this net, board greys everything else; tap again = release
    div.onclick = ()=>{ focusNet = (focusNet === n) ? null : n; renderSide(); draw(); };
    el.appendChild(div);
  }
  const nEl = document.getElementById("cNets");
  nEl.textContent = `${doneN}/${nets.length} nets`;
  nEl.className = doneN === nets.length ? "ok" : "";
  const nShort = conn.shorts.length + (conn.fusions ? conn.fusions.length : 0);
  const sh = document.getElementById("cShorts");
  sh.textContent = `${nShort} short${nShort === 1 ? "" : "s"}`;
  sh.className = nShort ? "bad" : "ok";
  const gp = document.getElementById("cGaps");
  gp.textContent = `${conn.gaps.length} gap alert${conn.gaps.length === 1 ? "" : "s"}`;
  gp.className = conn.gaps.length ? "warn" : "ok";
  // the board line: size when it is sound, the count of problems when it is not
  const bp = conn.board || [];
  const bEl = document.getElementById("cBoard");
  const [bw, bh] = polySize(outlineNow());
  bEl.textContent = bp.length
    ? `${bp.length} board issue${bp.length === 1 ? "" : "s"}`
    : `${bw.toFixed(1)} × ${bh.toFixed(1)} mm`;
  bEl.className = bp.length ? "bad" : "ok";

  const al = document.getElementById("alerts");
  al.innerHTML = "";
  const row = (cls, text, loc)=>{
    const d = document.createElement("div");
    d.className = cls; d.textContent = text;
    if (loc) d.onclick = ()=>flyTo(loc[0], loc[1]);
    al.appendChild(d);
  };
  conn.shorts.forEach((sh,i)=> row("short", "✕ SHORT: " + sh.join(" + "),
                                   conn.shortLocs[i]));
  (conn.fusions||[]).forEach((f,i)=> row("short", "✕ ORNAMENT will weld: " + f.join(" + "),
                                         conn.fusionLocs[i]));
  (conn.board||[]).forEach(b=> row("short", "✕ BOARD: " + b.msg, [b.x, b.y]));
  conn.gaps.forEach(g=> row("gap", "△ " + g.msg,
                            (g.x!==undefined) ? [g.x, g.y] : null));
}

/* ============================ input ==================================== */
const fingers = new Map();
let pinch0 = null;

cv.addEventListener("pointerdown", e=>{
  e.preventDefault();
  closePops();
  if (e.pointerType === "touch"){
    fingers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (fingers.size === 2){
      const [a,b] = [...fingers.values()];
      pinch0 = { d: Math.hypot(a[0]-b[0],a[1]-b[1]), s: view.s,
                 mid: [(a[0]+b[0])/2,(a[1]+b[1])/2],
                 world: S2W(((a[0]+b[0])/2)*DPR, ((a[1]+b[1])/2)*DPR) };
    }
    return;
  }
  // pen or mouse
  if (curView === "schem"){        // read-only: the pen pans instead of drawing
    schemPan = [e.offsetX, e.offsetY];
    cv.setPointerCapture(e.pointerId);
    return;
  }
  const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
  if (boardMode){
    cv.setPointerCapture(e.pointerId);
    // Touching a hole ALWAYS picks it up, whatever shape tool is selected.
    // Nudging a hole is the commonest thing you do here; it must never be
    // gated behind remembering which sub-tool you left on.
    const h = holeAt(wx, wy);
    if (h){
      selHole = h;
      dragHole = {h, dx: wx-h.x, dy: wy-h.y, x0: h.x, y0: h.y};
      renderBoardPanel(); draw();
      return;
    }
    if (boardTool === "hole"){
      const nh = {x:+sn(wx).toFixed(2), y:+sn(wy).toFixed(2), d:holeD};
      boardHoles.push(nh);
      selHole = nh;
      undoStack.push({op:"holeadd"});
      markDirty(); analyze(); draw(); renderBoardPanel();
      return;
    }
    selHole = null; renderBoardPanel();
    if (boardTool === "shape"){ cur = [[wx,wy]]; return; }
    prim = {x0:sn(wx), y0:sn(wy), x1:sn(wx), y1:sn(wy)};    // rect / circle
    return;
  }
  if (moveMode){
    const c = compAt(wx, wy);
    if (c){
      dragComp = { c, sx: wx, sy: wy,
                   m0: moves[c.name] ? [...moves[c.name]] : [0, 0] };
      cv.setPointerCapture(e.pointerId);
    }
    return;
  }
  if (erase){
    // continuous erasing: hold and slide, everything the tip crosses goes.
    // Deletions collect into ONE undo entry per gesture.
    eraseSession = [];
    eraseAt(wx, wy);
    cv.setPointerCapture(e.pointerId);
    return;
  }
  cur = [[wx,wy]];
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointermove", e=>{
  e.preventDefault();
  if (schemPan && e.pointerType !== "touch"){
    view.x -= (e.offsetX - schemPan[0]) / view.s;
    view.y += (e.offsetY - schemPan[1]) / view.s;
    schemPan = [e.offsetX, e.offsetY];
    draw();
    return;
  }
  if (e.pointerType === "touch"){
    if (!fingers.has(e.pointerId)) return;
    const prev = fingers.get(e.pointerId);
    fingers.set(e.pointerId, [e.offsetX, e.offsetY]);
    if (fingers.size === 1 && !pinch0){
      view.x -= (e.offsetX - prev[0]) / view.s;
      view.y += (e.offsetY - prev[1]) / view.s;
      draw();
    } else if (fingers.size === 2 && pinch0){
      const [a,b] = [...fingers.values()];
      const d = Math.hypot(a[0]-b[0], a[1]-b[1]);
      view.s = Math.min(60, Math.max(1.5, pinch0.s * d / pinch0.d));
      const mid = [(a[0]+b[0])/2, (a[1]+b[1])/2];
      view.x = pinch0.world[0] - mid[0]/view.s;
      view.y = pinch0.world[1] + mid[1]/view.s;
      draw();
    }
    return;
  }
  if (dragHole){
    const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
    dragHole.moved = true;
    dragHole.h.x = +sn(wx - dragHole.dx).toFixed(2);
    dragHole.h.y = +sn(wy - dragHole.dy).toFixed(2);
    showReadout(`X ${dragHole.h.x.toFixed(2)}   Y ${dragHole.h.y.toFixed(2)}   ` +
                `⌀ ${dragHole.h.d.toFixed(1)}`);
    renderBoardPanel();          // the inspector counts up with the hand
    draw();
    return;
  }
  if (prim){
    const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
    prim.x1 = sn(wx); prim.y1 = sn(wy);
    const [w,h] = polySize(primOutline(prim));
    showReadout(`${w.toFixed(1)} × ${h.toFixed(1)} mm`);
    draw();
    return;
  }
  if (dragComp){
    const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
    dragComp.moved = true;
    moves[dragComp.c.name] = [ +(dragComp.m0[0] + wx - dragComp.sx).toFixed(2),
                               +(dragComp.m0[1] + wy - dragComp.sy).toFixed(2) ];
    applyMoves(); draw();       // analyze() waits for pointerup: it is O(n2)
    return;
  }
  if (erase && eraseSession !== null){
    const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
    eraseAt(wx, wy);
    return;
  }
  if (!cur) return;
  const [wx,wy] = S2W(e.offsetX*DPR, e.offsetY*DPR);
  const last = cur[cur.length-1];
  if (d2(wx,wy,last[0],last[1]) > 0.02) {
    cur.push([wx,wy]);
    if (boardMode && cur.length > 2){
      const [w,h] = polySize(cur);
      showReadout(`${w.toFixed(1)} × ${h.toFixed(1)} mm`);
    }
    draw();
  }
});
function endTouch(e){
  fingers.delete(e.pointerId);
  if (fingers.size < 2) pinch0 = null;
}
cv.addEventListener("pointerup", e=>{
  if (schemPan){ schemPan = null; return; }
  e.preventDefault();
  if (e.pointerType === "touch"){ endTouch(e); return; }
  if (dragHole){
    showReadout(null);
    if (dragHole.moved){
      undoStack.push({op:"holemove", h: dragHole.h, x: dragHole.x0, y: dragHole.y0});
      markDirty(); analyze();
    }
    dragHole = null; draw();
    return;
  }
  if (prim){
    const p = prim; prim = null; showReadout(null);
    const [w,h] = polySize(primOutline(p));
    if (w < 2 || h < 2){ draw(); return; }        // a tap, not a shape
    setOutline(primOutline(p));
    return;
  }
  if (boardMode && cur){
    const pts = cur; cur = null; showReadout(null);
    if (pts.length < 8){ draw(); return; }        // too short to be an outline
    // an outline closes itself: the hand never returns exactly to the start
    let o = rdp(pts, 0.12 + smoothVal * 0.5);
    for (let k = 0; k < Math.round(smoothVal*3); k++) o = smooth(o);
    o = rdp(o, 0.08);
    if (o.length >= 3) setOutline(o); else draw();
    return;
  }
  if (dragComp){
    const nm = dragComp.c.name, m = moves[nm];
    if (dragComp.moved){
      if (m && !m[0] && !m[1]) delete moves[nm];      // dragged back home
      undoStack.push({op:"move", name:nm, prev:dragComp.m0});
      markDirty(); analyze();
      toast(m && (m[0] || m[1])
        ? `${nm} at ${m[0].toFixed(1)}, ${m[1].toFixed(1)} mm from design`
        : `${nm} back at design position`);
    }
    dragComp = null; draw();
    return;
  }
  if (erase){
    if (eraseSession && eraseSession.length)
      undoStack.push({op:"delmulti", items: eraseSession});
    eraseSession = null;
    return;
  }
  if (!cur) return;
  finishStroke();
});
cv.addEventListener("pointercancel", e=>{
  if (e.pointerType === "touch") endTouch(e);
  else {
    cur = null;
    if (dragComp){       // abort the drag: put the component back where it was
      if (dragComp.m0[0] || dragComp.m0[1]) moves[dragComp.c.name] = dragComp.m0;
      else delete moves[dragComp.c.name];
      applyMoves(); dragComp = null;
    }
  }
  draw();
});
cv.addEventListener("wheel", e=>{      // desktop testing
  e.preventDefault();
  const w = S2W(e.offsetX*DPR, e.offsetY*DPR);
  view.s = Math.min(60, Math.max(1.5, view.s * (e.deltaY < 0 ? 1.1 : 0.9)));
  view.x = w[0] - e.offsetX/view.s;
  view.y = w[1] + e.offsetY/view.s;
  draw();
}, {passive:false});

function snapEnd(pt){
  let best = null, bd = 1e9;
  for (const p of B.pads){
    const d = Math.hypot(pt[0]-p.x, pt[1]-p.y);
    const r = Math.max(p.d, p.pad_w||0)/2 + 1.0;
    if (d < r && d < bd){ bd = d; best = [p.x, p.y]; }
  }
  if (best) return best;
  for (const s of strokes){                       // junction onto another stroke
    for (const q of s.pts){
      const d = Math.hypot(pt[0]-q[0], pt[1]-q[1]);
      if (d < 0.9 && d < bd){ bd = d; best = [q[0], q[1]]; }
    }
  }
  return best || pt;
}
function finishStroke(){
  let pts = cur; cur = null;
  if (pts.length < 2){ draw(); return; }
  // smoothness 0..1 controls both how aggressively corners are simplified away
  // and how many rounding passes run afterwards. At 0 the line is kept almost
  // raw (only sensor jitter removed); at 1 it is generously rounded.
  const tol = 0.04 + smoothVal * 0.55;
  const passes = Math.round(smoothVal * 3);
  pts = rdp(pts, tol);
  for (let k = 0; k < passes; k++) pts = smooth(pts);
  pts = rdp(pts, 0.03 + smoothVal * 0.05);
  pts[0] = snapEnd(pts[0]);
  pts[pts.length-1] = snapEnd(pts[pts.length-1]);
  if (pts.length < 2){ draw(); return; }
  strokes.push({ pts: pts.map(p=>[+p[0].toFixed(3), +p[1].toFixed(3)]), w: drawW });
  undoStack.push({op:"add"});
  markDirty(); analyze(); draw();
}

/* ============================ buttons ================================== */
function toast(msg, bad){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("bad", !!bad);
  t.style.opacity = 1;
  clearTimeout(t._h);
  // a problem stays up long enough to actually be read
  t._h = setTimeout(()=>t.style.opacity=0, bad ? 6000 : 1600);
}
/* Autosave: there is no Save button. Every change schedules a save 2 s after the
   pen lifts; a 15 s heartbeat retries anything that failed; leaving the page
   flushes via sendBeacon. Success is silent - only failure speaks. */
let saveT = null;
function markDirty(){
  dirty = true;
  clearTimeout(saveT);
  saveT = setTimeout(save, 2000);
}

function eraseAt(wx, wy){
  let hit = false;
  // in board mode the eraser takes holes, not traces: the tool you are in
  // decides what is erasable, so copper can never be lost while shaping
  if (boardMode){
    const h = holeAt(wx, wy);
    if (h){
      const i = boardHoles.indexOf(h);
      if (i >= 0){
        boardHoles.splice(i, 1);
        if (selHole === h) selHole = null;
        undoStack.push({op:"holedel", i, h});
        markDirty(); analyze(); draw(); renderBoardPanel();
      }
    }
    return;
  }
  for (let i=strokes.length-1;i>=0;i--)
    if (distPtStroke(wx,wy,strokes[i]) < strokes[i].w/2 + 0.8){
      eraseSession.push({i, s: strokes[i]});
      strokes.splice(i,1);
      hit = true;
    }
  if (hit){ markDirty(); analyze(); draw(); }
}
function doUndo(){
  const u = undoStack.pop();
  if (!u) return;
  if (u.op === "add") strokes.pop();
  else if (u.op === "delmulti"){
    // restore in reverse deletion order so recorded indices stay valid
    for (let k=u.items.length-1;k>=0;k--)
      strokes.splice(u.items[k].i, 0, u.items[k].s);
  }
  else if (u.op === "move"){
    if (u.prev[0] || u.prev[1]) moves[u.name] = u.prev;
    else delete moves[u.name];
    applyMoves();
  }
  else if (u.op === "outline") drawnOutline = u.prev;
  else if (u.op === "holeadd"){ const g = boardHoles.pop();
                                if (selHole === g) selHole = null; }
  else if (u.op === "holedel")  boardHoles.splice(u.i, 0, u.h);
  else if (u.op === "holemove"){ u.h.x = u.x; u.h.y = u.y; }
  else if (u.op === "holesize") u.h.d = u.d;
  else if (u.op === "holeedit"){ u.h.x = u.x; u.h.y = u.y; u.h.d = u.d; }
  else strokes.splice(u.i, 0, u.s);
  markDirty(); analyze(); draw(); renderBoardPanel();
}
document.getElementById("undoB").onclick = doUndo;

// Cmd+Z on the iPad's keyboard and the Mac, Ctrl+Z everywhere else. One undo
// stack across all three views, so it reaches outlines and holes as readily as
// traces. Inside a number field the browser's own text undo wins - typing into
// the inspector must not reshape the board behind you.
window.addEventListener("keydown", e=>{
  const k = (e.key || "").toLowerCase();
  if (k !== "z" || !(e.metaKey || e.ctrlKey) || e.shiftKey || e.altKey) return;
  const t = document.activeElement;
  if (t && (t.tagName === "INPUT" || t.tagName === "SELECT" ||
            t.tagName === "TEXTAREA")) return;
  e.preventDefault();
  if (!undoStack.length){ toast("Nothing left to undo"); return; }
  doUndo();
});
// Draw / Erase / Move are one choice: the pencil is always exactly one tool.
function setTool(t){

  moveMode = t === "move";
  for (const id of ["toolDraw","toolErase","toolMove"])
    document.getElementById(id).classList.toggle("on",

document.getElementById("toolDraw").onclick  = ()=>setTool("draw");
document.getElementById("toolErase").onclick = ()=>setTool("erase");

/* ===================== the Board panel ================================== */

// Mount-hole standards, from The Source pcb-v3/PARTS.md. Clearance = the screw
// passes through; bite = a thread cuts into FR4. Clearance is the safe default.
const HOLE_SIZES = [
  {d: 2.2, nm: "M2 clearance"}, {d: 2.7, nm: "M2.5 clearance"},
  {d: 3.2, nm: "M3 clearance"}, {d: 1.7, nm: "M2 bite"},
  {d: 2.2, nm: "M2.5 bite"},    {d: 2.6, nm: "M3 bite"},
];
const hSel = document.getElementById("bHoleSize");
HOLE_SIZES.forEach((s,i)=>{
  const o = document.createElement("option");
  o.value = i; o.textContent = `${s.nm}  ⌀${s.d.toFixed(1)}`;
  if (s.d === holeD && s.nm === "M3 clearance") o.selected = true;
  hSel.appendChild(o);
});
hSel.onchange = ()=>{
  holeD = HOLE_SIZES[+hSel.value].d;
  // a selected hole follows the choice: pick the hole, pick the size
  if (selHole){
    undoStack.push({op:"holesize", h:selHole, d:selHole.d});
    selHole.d = holeD; markDirty(); analyze(); draw();
  }
  renderBoardPanel();

function scaleOutlineTo(w, h){
  const ol = outlineNow();
  const xs = ol.map(p=>p[0]), ys = ol.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  const cw = x1-x0, ch = y1-y0;
  if (cw <= 0 || ch <= 0) return;
  const cx = (x0+x1)/2, cy = (y0+y1)/2;
  const kx = w/cw, ky = h/ch;
  // scale about the CENTRE: the parts stay where they are relative to the
  // middle of the board, which is what "make it 60 wide" means by hand
  setOutline(ol.map(([x,y]) => [cx + (x-cx)*kx, cy + (y-cy)*ky]));
}
function moveOutlineTo(cx, cy){
  const ol = outlineNow();
  const xs = ol.map(p=>p[0]), ys = ol.map(p=>p[1]);
  const ox = (Math.min(...xs)+Math.max(...xs))/2;
  const oy = (Math.min(...ys)+Math.max(...ys))/2;
  setOutline(ol.map(([x,y]) => [x + cx - ox, y + cy - oy]));
}
function outlineCentre(){
  const ol = outlineNow();
  const xs = ol.map(p=>p[0]), ys = ol.map(p=>p[1]);
  return [(Math.min(...xs)+Math.max(...xs))/2, (Math.min(...ys)+Math.max(...ys))/2];
}
// A field commits on Enter or on blur, never on every keystroke: half-typed
// numbers must not reshape the board under your hand.
function onCommit(el, fn){
  el.addEventListener("keydown", e=>{ if (e.key === "Enter") el.blur(); });
  el.addEventListener("change", fn);
}
onCommit(document.getElementById("bW"), ()=>{
  const w = parseFloat(document.getElementById("bW").value);
  const [, h] = polySize(outlineNow());
  if (w > 1) scaleOutlineTo(w, h); else renderBoardPanel();
});
onCommit(document.getElementById("bH"), ()=>{
  const h = parseFloat(document.getElementById("bH").value);
  const [w] = polySize(outlineNow());
  if (h > 1) scaleOutlineTo(w, h); else renderBoardPanel();
});
onCommit(document.getElementById("bX"), ()=>{
  const x = parseFloat(document.getElementById("bX").value);
  const [, cy] = outlineCentre();
  if (isFinite(x)) moveOutlineTo(x, cy); else renderBoardPanel();
});
onCommit(document.getElementById("bY"), ()=>{
  const y = parseFloat(document.getElementById("bY").value);
  const [cx] = outlineCentre();
  if (isFinite(y)) moveOutlineTo(cx, y); else renderBoardPanel();
});
function editSel(field, min){
  return ()=>{
    if (!selHole) return;
    const v = parseFloat(document.getElementById(field === "d" ? "hD"
                          : field === "x" ? "hX" : "hY").value);

    undoStack.push({op:"holeedit", h:selHole, x:selHole.x, y:selHole.y, d:selHole.d});
    selHole[field] = +v.toFixed(2);

}
onCommit(document.getElementById("hX"), editSel("x"));

document.getElementById("hDel").onclick = ()=>{

function renderBoardPanel(){
  if (!B || !document.getElementById("panelBoard").classList.contains("show")) return;
  const [w,h] = polySize(outlineNow());

  const set = (id,v)=>{ const el=document.getElementById(id);
                        if (document.activeElement !== el) el.value = v; };
  set("bW", w.toFixed(1)); set("bH", h.toFixed(1));
  set("bX", cx.toFixed(1)); set("bY", cy.toFixed(1));
  document.getElementById("bHint").textContent = drawnOutline
    ? `${drawnOutline.length} points, drawn here`
    : "from the circuit — draw to replace it";

  list.innerHTML = "";
  if (!hs.length){

  }
  hs.forEach((hh,i)=>{

                  `<span class="hd">${hh.x.toFixed(1)}, ${hh.y.toFixed(1)}</span>`;
    d.onclick = ()=>{ selHole = (selHole === hh) ? null : hh;

  for (const b of (conn && conn.board) || []){
    const d = document.createElement("div");
    d.textContent = "✕ " + b.msg;
