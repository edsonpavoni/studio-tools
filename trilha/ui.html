/* ==================== schematic / silkscreen view ======================
   The printable legend for the face of the board that carries NO copper:
   footprints, port numbers, net names, pin 1, polarity. Everything here is
   a read of /board — this view never edits the circuit or the drawing.

   FLIP mirrors POSITIONS about the board's centre line and nothing else.
   Glyphs are always drawn upright, because a silkscreen whose numbers come
   out backwards is a silkscreen you cannot print. That is the whole reason
   the flip exists: hold the board either way up and read the same marks.  */
/* ---- PROBE: the assistant points at pads, the bench follows ------------
   Born 2026-08-27, after an afternoon of "measure between QB pin 3 and pin 1"
   over chat while Edson counted pads by eye. Claude Code sits beside this
   window; it calls probe(["QB.pin3","QB.pin1"], "expect ~10k") and the pads
   light up, labelled A and B, with the instruction on the sheet. */
let probePads = [];           // pad names to ring, in order
let probeMsg  = "";           // the instruction to show
const PROBE_INK = "#D0342C";

function probe(names, msg, opts){
  probePads = names == null ? [] : (Array.isArray(names) ? names : [names]);
  probeMsg  = msg || "";
  if (curView !== "schem") setView("schem");
  if (probePads.length && !(opts && opts.keepView)) probeFit();
  draw();
  return probePads.length + " pad(s) highlighted";
}
function probeClear(){ return probe(null, ""); }

/* frame the probed pads with enough around them to stay recognisable */
function probeFit(){
  const box = schemBox();
  const MX  = x => schemFlip ? 2*box.cx - x : x;
  const pts = [];
  for (const nm of probePads){
    const p = B.pads.find(q => q.name === nm);
    if (p) pts.push([MX(p.x), p.y]);
  }
  if (!pts.length) return;
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for (const q of pts){ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]);
                        y0=Math.min(y0,q[1]); y1=Math.max(y1,q[1]); }
  const pad = 22;                       // mm of context - enough to recognise where you are
  const bw = (x1-x0) + 2*pad, bh = (y1-y0) + 2*pad;
  view.s = Math.max(6, Math.min(46, Math.min(cv.clientWidth/bw, cv.clientHeight/bh)));
  view.x = (x0-pad) - (cv.clientWidth/view.s - bw)/2;
  view.y = (y1+pad) + (cv.clientHeight/view.s - bh)/2;
}

let schemFlip = false;        // false = copper side, true = component side
let schemPan  = null;         // [x,y] while dragging the schematic with a mouse

/* ink on paper, not chrome: this is what a printer would put down */
const SILK = { sheet:"#F6F2EA", paper:"#E9E2D4", ink:"#191919", mid:"#6A645C",
               hole:"#FFFFFF", faint:"#B4AC9C" };
const SILK_MARGIN = 11;       // mm of sheet around the blank, so the labels on
                              // the outermost parts have somewhere to land
const SILK_FOOT   = 22;       // deeper at the bottom: the title block lives there,
                              // below where the outermost net names reach

/* A net id is not a signal. `NET_3` tells you nothing standing at a bench; SDA
   tells you everything. The board can ship a signals.json saying what each net
   carries and what a part's pins do — see server.py. It is optional data, never
   a name typed into this renderer: a silkscreen label that has drifted from the
   netlist is worse than no label at all. Missing file, missing entry: fall back
   to the raw net id, which is at least always true. */
function sigNet(net){
  if (!net) return null;
  const m = (B && B.signals && B.signals.nets) || {};
  return m[net] || net;
}
function sigPin(padName){
  const m = (B && B.signals && B.signals.pins) || {};
  return m[padName] || null;
}
function sigPol(padName){
  const m = (B && B.signals && B.signals.polarity) || {};
  return m[padName] || null;
}

function paintSideTag(){
  const t = document.getElementById("sideTag");
  if (t) t.textContent = schemFlip ? "COMPONENT SIDE · mirrored"
                                   : "COPPER SIDE · as routed";
}

function schemBox(){
  const o = outlineNow();
  let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity;
  for (const p of o){
    x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]);
    y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
  }
  return {x0,x1,y0,y1, cx:(x0+x1)/2, cy:(y0+y1)/2};
}

function drawSchem(){
  const w = cv.width, h = cv.height, s = view.s * DPR;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,w,h);
  const css = getComputedStyle(document.documentElement);
  const C = n => css.getPropertyValue(n).trim();
  ctx.fillStyle = C("--bg") || "#1E1E1E";
  ctx.fillRect(0,0,w,h);
  if (!B) return;

  const box = schemBox();
  const MX  = x => schemFlip ? 2*box.cx - x : x;      // mirror, positions only
  const S   = (x,y) => W2S(MX(x), y);
  const mm  = v => v * s;                             // millimetres -> device px
  const lw  = v => Math.max(1, mm(v));
  const font = (size, weight) =>
    (weight||600) + " " + Math.max(6, mm(size)) + "px ui-monospace, Menlo, monospace";
  const labels = mm(1) >= 7;         // under this, nothing would be readable

  /* ---- the sheet, then the blank on it --------------------------------
     A drawing sheet rather than a bare outline: RGA and RGB sit 5 mm from the
     board edge and their net names need more room than that. On a sheet they
     stay readable, and the board edge is still drawn, so nothing is ambiguous
     about where the copper actually stops. */
  const M = SILK_MARGIN, FOOT = SILK_FOOT;
  const [sxa, sya] = S(box.x0 - M, box.y1 + M);
  const [sxb, syb] = S(box.x1 + M, box.y0 - FOOT);
  ctx.fillStyle = SILK.sheet;
  ctx.fillRect(Math.min(sxa,sxb), Math.min(sya,syb),
               Math.abs(sxb-sxa), Math.abs(syb-sya));

  const out = outlineNow();
  ctx.beginPath();
  out.forEach((p,i)=>{ const [X,Y]=S(p[0],p[1]); i?ctx.lineTo(X,Y):ctx.moveTo(X,Y); });
  ctx.closePath();
  ctx.fillStyle = SILK.paper; ctx.fill();
  ctx.strokeStyle = SILK.ink; ctx.lineWidth = lw(0.3); ctx.stroke();

  /* ---- component courtyards, dashed and quiet ------------------------- */
  const comps = B.comps || [];
  for (const c of comps){
    const [X,Y] = S(c.x, c.y);
    ctx.save();
    ctx.translate(X, Y);
    // world y is up and canvas y is down, so a world CCW turn is CW here;
    // mirroring reverses the handedness again
    ctx.rotate((schemFlip ? 1 : -1) * ((c.rot||0) * Math.PI/180));
    ctx.strokeStyle = SILK.faint; ctx.lineWidth = lw(0.18);
    ctx.setLineDash([mm(0.7), mm(0.5)]);
    ctx.strokeRect(-mm(c.w)/2, -mm(c.h)/2, mm(c.w), mm(c.h));
    ctx.setLineDash([]);
    ctx.restore();
  }

  /* ---- which way each component's labels lean -------------------------
     perpendicular to its row of pads, and away from the middle of the
     board, so the text runs out into clear space instead of into a
     neighbour's pins. */
  const pads = B.pads.map(p => ({p, x: MX(p.x), y: p.y}));
  const groups = {};
  for (const q of pads){
    const cn = padComp(q.p) || "?";
    (groups[cn] = groups[cn] || []).push(q);
  }
  const lean = {};
  for (const cn of Object.keys(groups)){
    const g  = groups[cn];
    const xs = g.map(q=>q.x), ys = g.map(q=>q.y);
    const sx = Math.max.apply(null,xs) - Math.min.apply(null,xs);
    const sy = Math.max.apply(null,ys) - Math.min.apply(null,ys);
    const mx = xs.reduce((a,b)=>a+b,0)/xs.length;
    const my = ys.reduce((a,b)=>a+b,0)/ys.length;
    lean[cn] = (sx >= sy) ? [0, my >= box.cy ? 1 : -1]    // a row  -> up / down
                          : [mx >= box.cx ? 1 : -1, 0];   // a column -> out sideways
  }

  /* ---- pads, drills, pin 1, and the numbers that are the point --------- */
  for (const q of pads){
    const p = q.p, [X,Y] = W2S(q.x, q.y);
    const cn  = padComp(p) || "?";
    const ring = Math.max(p.pad_w || 0, p.pad_h || 0, (p.d||1) + 0.6);

    ctx.strokeStyle = SILK.ink; ctx.lineWidth = lw(0.2);
    ctx.fillStyle = SILK.hole;
    if (p.shape === "rect"){
      const pw = mm(p.pad_w || ring), ph = mm(p.pad_h || ring);
      ctx.beginPath(); ctx.rect(X-pw/2, Y-ph/2, pw, ph); ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(X, Y, mm(ring)/2, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(X, Y, mm(p.d||0.8)/2, 0, 7);
    ctx.fillStyle = SILK.faint; ctx.fill();

    // pin 1 wears a square shoulder — the one mark every assembler looks for
    if (/\.pin1$/.test(p.name)){
      const r = mm(ring)/2 + mm(0.4);
      ctx.strokeStyle = SILK.ink; ctx.lineWidth = Math.max(1.3, mm(0.3));
      ctx.strokeRect(X-r, Y-r, 2*r, 2*r);
    }

    if (!labels) continue;
    const L  = lean[cn] || [0,-1];
    const ux = L[0], uy = -L[1];                 // canvas y grows downward
    const step = mm(ring)/2 + mm(0.6);
    const ox = X + ux*step, oy = Y + uy*step;
    ctx.textAlign    = ux ? (ux > 0 ? "left" : "right") : "center";
    ctx.textBaseline = uy ? (uy > 0 ? "top"  : "bottom") : "middle";

    const fn  = sigPin(p.name);                   // G / D / S and the like
    const num = p.name.split(".").pop().replace(/^pin/, "");
    ctx.fillStyle = SILK.ink;
    if (fn) {
      // The letter is the thing you actually read when deciding which way round a
      // part goes in, so it gets the weight and the number rides along smaller.
      ctx.font = font(1.0, 500);
      const wNum = ctx.measureText(num + " ").width;
      ctx.font = font(1.7, 700);
      const wFn = ctx.measureText(fn).width;
      const total = wNum + wFn;
      let x0 = ox;                                // honour the alignment we chose
      if (ctx.textAlign === "center")     x0 = ox - total / 2;
      else if (ctx.textAlign === "right") x0 = ox - total;
      const al = ctx.textAlign;
      ctx.textAlign = "left";
      ctx.font = font(1.0, 500);  ctx.fillText(num + " ", x0, oy);
      ctx.font = font(1.7, 700);  ctx.fillText(fn, x0 + wNum, oy);
      ctx.textAlign = al;
    } else {
      ctx.font = font(1.15, 700);
      ctx.fillText(num, ox, oy);
    }
    const carries = sigNet(p.net);
    if (carries){                                 // what this port actually carries
      ctx.font = font(0.85, 500); ctx.fillStyle = SILK.mid;
      if (ux === 0){
        // a row of pads on 2.54 leaves no width for a net name, so the names
        // stand up and read along the pin instead - exactly what a real
        // silkscreen does when the pitch runs out
        ctx.save();
        ctx.translate(ox, oy + uy*mm(1.5));
        ctx.rotate(-Math.PI/2);
        ctx.textAlign = uy > 0 ? "right" : "left";
        ctx.textBaseline = "middle";
        ctx.fillText(carries, 0, 0);
        ctx.restore();
      } else {
        ctx.fillText(carries, ox + ux*mm(1.7), oy + uy*mm(1.7));
      }
    }
  }

  /* ---- polarity ---------------------------------------------------------
     Which pads get a big + or -, from signals.json. It is not only the
     electrolytic: the lasers are LOW-SIDE switched, so a laser's + is on 5V and
     its - is the MOSFET drain - a switched node, not ground. No "V5 means plus,
     GND means minus" rule could ever work that out, so the board states it and
     signals.json writes out the derivation for each so it can be re-checked.

     The sign sits on the FAR side of its pad, along the axis the part's pads lie
     on. That is the one direction that cannot collide with the sibling pad
     however the part is turned, and it is where a silkscreen puts it. */
  const compBy = {};
  for (const c of comps) compBy[c.name] = c;
  for (const q of pads){
    const p = q.p;
    const sign = sigPol(p.name);
    if (!sign) continue;
    const c = compBy[padComp(p) || ""];
    let dx = 1, dy = 0;
    if (c){
      const gx = q.x - MX(c.x), gy = q.y - c.y;
      if (Math.abs(gx) >= Math.abs(gy)) { dx = Math.sign(gx) || 1; dy = 0; }
      else                              { dx = 0; dy = Math.sign(gy) || 1; }
    }
    const [X,Y] = W2S(q.x, q.y);
    const ring = Math.max(p.pad_w || 0, p.pad_h || 0, (p.d||1) + 0.6);
    const off  = mm(ring)/2 + mm(0.8);   // hug the pad: drift and it starts to
                                         // look like it belongs to the neighbour
    ctx.font = font(2.4, 700); ctx.fillStyle = SILK.ink;
    ctx.textAlign    = dx ? (dx > 0 ? "left" : "right") : "center";
    ctx.textBaseline = dy ? (dy > 0 ? "bottom" : "top") : "middle";
    ctx.fillText(sign, X + dx*off, Y - dy*off);   // world y is up, canvas y down
  }

  /* ---- mounting holes -------------------------------------------------- */
  for (const hh of (holesOwnedHere() ? boardHoles : (B.holes || []))){
    const [X,Y] = S(hh.x, hh.y), r = mm(hh.d)/2;
    ctx.beginPath(); ctx.arc(X, Y, r, 0, 7);
    ctx.fillStyle = SILK.hole; ctx.fill();
    ctx.strokeStyle = SILK.ink; ctx.lineWidth = lw(0.2); ctx.stroke();
    ctx.beginPath();                              // crosshair: a hole, not a pad
    ctx.moveTo(X-r-mm(0.8), Y); ctx.lineTo(X+r+mm(0.8), Y);
    ctx.moveTo(X, Y-r-mm(0.8)); ctx.lineTo(X, Y+r+mm(0.8));
    ctx.strokeStyle = SILK.faint; ctx.lineWidth = lw(0.15); ctx.stroke();
    if (labels){
      // outward, away from the middle of the board. Straight down put H1's
      // diameter on top of LA's pads - the mounts sit in the corners, and the
      // corner is the one direction with nothing else in it.
      const ox = hh.x - box.cx, oy = hh.y - box.cy;
      const hx = Math.abs(ox) >= Math.abs(oy) ? (Math.sign(ox) || 1) : 0;
      const hy = hx ? 0 : (Math.sign(oy) || -1);
      const d  = r + mm(0.9);
      ctx.font = font(0.8, 500); ctx.fillStyle = SILK.mid;
      ctx.textAlign    = hx ? (hx > 0 ? "left" : "right") : "center";
      ctx.textBaseline = hy ? (hy > 0 ? "bottom" : "top") : "middle";
      ctx.fillText("\u00D8" + hh.d, X + (schemFlip ? -hx : hx)*d, Y - hy*d);
    }
  }

  /* ---- reference designators last, haloed so they survive the pads ----- */
  if (labels) for (const c of comps){
    const L = lean[c.name] || [0,-1];
    // A two-pin part straddles its own centre, so the gap between its pads is
    // free and the name goes there. A denser part has no such gap: its name
    // steps inboard, opposite its labels. Stepping a two-pin part inboard is
    // what used to drop RGA's name on QA's pin 3.
    const np  = (groups[c.name] || []).length;
    const off = np <= 2 ? 0 : (L[0] ? c.w/2 : c.h/2) + 1.8;
    const [X,Y] = S(c.x - L[0]*off, c.y - L[1]*off);
    ctx.font = font(1.5, 700);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = Math.max(2, mm(0.55));
    ctx.strokeStyle = SILK.paper; ctx.strokeText(c.name, X, Y);
    ctx.fillStyle = SILK.ink;     ctx.fillText(c.name, X, Y);
  }

  /* ---- the instruction: SCREEN space, so panning can never lose it ------ */
  if (probeMsg){
    const fs = Math.max(13, 15*DPR), padY = Math.max(10, 11*DPR);
    ctx.font = "700 " + fs + "px Inter, -apple-system, system-ui, sans-serif";
    const tw = ctx.measureText(probeMsg).width;
    const bh = fs + padY*2;
    ctx.fillStyle = PROBE_INK;
    ctx.fillRect(0, 0, w, bh);
    ctx.fillStyle = "#FFFFFF";
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(probeMsg, Math.max(padY, (w - tw)/2), bh/2);
  }

  /* ---- probe rings, over everything, impossible to miss ---------------- */
  if (probePads.length){
    probePads.forEach((nm, i) => {
      const p = B.pads.find(q => q.name === nm);
      if (!p) return;
      const [X, Y] = S(p.x, p.y);
      const ring = Math.max(p.pad_w||0, p.pad_h||0, (p.d||1)+0.6);
      const r = mm(ring)/2 + mm(1.1);
      ctx.strokeStyle = PROBE_INK; ctx.lineWidth = Math.max(2.5, mm(0.55));
      ctx.beginPath(); ctx.arc(X, Y, r, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(X, Y, r + mm(0.9), 0, 7);
      ctx.lineWidth = Math.max(1, mm(0.2)); ctx.stroke();
      // A, B, C... so "measure between A and B" needs no counting of pads
      // tag sits up and out on a leader, clear of the pads it is pointing at
      const tag = String.fromCharCode(65 + i);
      const tR = Math.max(11, mm(1.5));
      const tx = X + r + mm(3.2), ty = Y - r - mm(3.2);
      ctx.beginPath(); ctx.moveTo(X + r*0.72, Y - r*0.72); ctx.lineTo(tx, ty);
      ctx.lineWidth = Math.max(1.5, mm(0.25)); ctx.stroke();
      ctx.beginPath(); ctx.arc(tx, ty, tR, 0, 7);
      ctx.fillStyle = PROBE_INK; ctx.fill();
      ctx.font = "700 " + Math.max(13, tR*1.35) + "px Inter, -apple-system, sans-serif";
      ctx.fillStyle = "#FFFFFF";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(tag, tx, ty);
      ctx.font = "700 " + Math.max(11, tR*0.95) + "px ui-monospace, Menlo, monospace";
      ctx.fillStyle = PROBE_INK;
      ctx.textAlign = "left"; ctx.textBaseline = "middle";
      ctx.fillText(nm, tx + tR + 5*DPR, ty);
    });
  }

  /* ---- title block, on the sheet, in ink: part of the artwork ---------- */
  if (labels){
    const [kx, ky] = W2S(box.x0 - M + 2, box.y0 - 12);   // never mirrored
    ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.font = font(1.45, 700); ctx.fillStyle = SILK.ink;
    ctx.fillText(schemFlip ? "COMPONENT SIDE \u2014 mirrored for print"
                           : "COPPER SIDE \u2014 as routed", kx, ky);
    ctx.font = font(0.95, 500); ctx.fillStyle = SILK.mid;
    ctx.fillText("\u25A1 pin 1     \u00D8 mount hole     " +
                 B.pads.length + " ports \u00B7 " +
                 Object.keys(B.nets || {}).length + " nets     " +
                 (box.x1-box.x0).toFixed(1) + " \u00D7 " +
                 (box.y1-box.y0).toFixed(1) + " mm",
                 kx, ky + mm(2.2));
    const legend = (B.signals && B.signals.pins_legend) || "";
    if (legend){
      ctx.font = font(1.1, 700); ctx.fillStyle = SILK.ink;
      ctx.fillText(legend, kx, ky + mm(4.6));
    }
  }
}

/* Four views, and the sidebar belongs to the view: board (shape the object),
   draw (route the circuit), schem (the printable legend), 3d (look at it).
   Copper and Ghost are overlays that ride on top, not views of their own. */
let curView = "draw";
function setView(m){
  curView = m;
  boardMode = m === "board";
  closePops();
  const v3 = m === "3d";
  const vs = m === "schem";
  document.getElementById("cv3").style.display = v3 ? "block" : "none";
  document.getElementById("legend").classList.toggle("show", v3);
  cv.style.display = v3 ? "none" : "block";
  document.getElementById("islDraw").classList.toggle("dim3d", v3 || boardMode || vs);
  // the flip button belongs to this view alone, and each visit starts copper-side
  document.getElementById("flipWrap").classList.toggle("show", vs);
  if (!vs) schemFlip = false;
  paintSideTag();
  for (const [id, key] of [["viewBoard","board"],["viewDraw","draw"],
                           ["viewSchem","schem"],["view3d","3d"]])
    document.getElementById(id).classList.toggle("on", m === key);
  // the panel follows the view, and picking up a view leaves the burn session
  burnOpen = false;
  document.getElementById("burnB").classList.remove("on");
  document.getElementById("burnB").firstElementChild
    .firstElementChild.setAttribute("href", "#i-fire");
  document.getElementById("panelBurn").classList.remove("show");
  document.getElementById("panelBoard").classList.toggle("show", boardMode);
  document.getElementById("panelDraw").classList.toggle("show", !boardMode);
  document.getElementById("sideTitle").textContent = boardMode ? "Board" : "Connections";
  if (!boardMode) selHole = null;
  showReadout(null);
  renderBoardPanel();
  if (v3) render3d(); else draw();
}
document.getElementById("viewBoard").onclick = ()=>setView("board");
document.getElementById("viewDraw").onclick  = ()=>setView("draw");
document.getElementById("viewSchem").onclick = ()=>setView("schem");
document.getElementById("view3d").onclick    = ()=>setView("3d");
document.getElementById("flipB").onclick = ()=>{
  schemFlip = !schemFlip;
  paintSideTag();
  draw();
};
document.getElementById("copperB").onclick = e=>{
  copperView = !copperView;
  e.currentTarget.classList.toggle("on", copperView);
  if (curView === "3d") setView("draw"); else draw();
};

/* ---- popovers (pencil size, smoothness) ------------------------------- */
function closePops(){
  for (const id of ["wPop","smoothPop"])
    document.getElementById(id).classList.remove("show");
}
function togglePop(popId, anchorId){
  const pop = document.getElementById(popId);
  const was = pop.classList.contains("show");
  closePops();
  if (was) return;
  const a = document.getElementById(anchorId).getBoundingClientRect();
  const s = document.getElementById("stage").getBoundingClientRect();
  pop.classList.add("show");
  const w = pop.getBoundingClientRect().width;
  pop.style.left = Math.max(8, a.left - s.left + a.width/2 - w/2) + "px";
}
document.getElementById("wArrow").onclick  = ()=>togglePop("wPop", "wArrow");
document.getElementById("smoothB").onclick = ()=>{
  togglePop("smoothPop", "smoothB"); smRender();
};

/* ===================== the burn session ================================= */
// Everything you need in the minute before the laser runs: what this board IS,
// the settings that will cut it, and the files. The converter is the gate - an
// export that refuses hands back its whole log, because that log is the answer.
function setBurn(on){
  burnOpen = on;
  document.getElementById("burnB").classList.toggle("on", on);
  document.getElementById("burnB").firstElementChild
    .firstElementChild.setAttribute("href", on ? "#i-back" : "#i-fire");
  document.getElementById("panelBurn").classList.toggle("show", on);
  document.getElementById("panelBoard").classList.toggle("show", !on && boardMode);
  document.getElementById("panelDraw").classList.toggle("show", !on && !boardMode);
  document.getElementById("sideTitle").textContent =
    on ? "Burn" : (boardMode ? "Board" : "Connections");
  if (on) renderBurn();
}
document.getElementById("burnB").onclick = ()=>setBurn(!burnOpen);

function renderBurn(){
  if (!B || !burnOpen) return;
  const [w,h] = polySize(outlineNow());
  const hs = holesOwnedHere() ? boardHoles : B.holes;
  const dias = [...new Set([...hs.map(x=>x.d), ...B.pads.map(p=>p.d)])]
                 .sort((a,b)=>a-b);
  const nets = Object.keys(B.nets).filter(n=>n!==B.pour_net);
  const done = conn ? nets.filter(n=>conn.netDone[n]).length : 0;
  const nShort = conn ? conn.shorts.length + (conn.fusions||[]).length : 0;
  const nGap = conn ? conn.gaps.length : 0;
  const nBoard = conn ? (conn.board||[]).length : 0;
  const widths = [...new Set(strokes.map(s=>s.w))].sort((a,b)=>a-b);
  const len = strokes.reduce((t,s)=>{
    let d = 0;
    for (let i=0;i+1<s.pts.length;i++)
      d += Math.hypot(s.pts[i+1][0]-s.pts[i][0], s.pts[i+1][1]-s.pts[i][1]);
    return t + d;
  }, 0);

  // Values are kept SHORT on purpose: this panel is 260 px wide and a value
  // that wraps onto a second line stops being a number you can scan.
  const row = (k, v, cls) =>
    `<div class="kv ${cls === "head" ? "head" : ""}">` +
    `<b>${k}</b><span class="${cls && cls !== "head" ? cls : ""}">${v}</span></div>`;
  const wr = widths.length === 0 ? "—"
           : widths.length === 1 ? `${widths[0].toFixed(1)} mm`
           : `${widths[0].toFixed(1)}–${widths[widths.length-1].toFixed(1)} mm`;
  document.getElementById("burnSpecs").innerHTML =
    row("outline", `${w.toFixed(1)} × ${h.toFixed(1)} mm`, "head") +
    row("shape", drawnOutline ? `drawn · ${drawnOutline.length} pts` : "from circuit") +
    row("material", "FR4 1.6 · 35 µm") +
    row("holes", `${hs.length} board · ${B.pads.length} parts`) +
    row("⌀", dias.map(d=>d.toFixed(1)).join(" · ") + " mm") +
    row("traces", `${strokes.length} · ${len.toFixed(0)} mm`) +
    row("widths", wr) +
    row("nets", `${done}/${nets.length}`, done===nets.length ? "ok" : "bad") +
    row("shorts", nShort, nShort ? "bad" : "ok") +
    row("gaps", nGap, nGap ? "bad" : "ok") +
    row("board", nBoard, nBoard ? "bad" : "ok");

  document.getElementById("burnRecipe").innerHTML =
    row("holes", "70% · 8× · w 0.10") +
    row("kerf", "target − 0.24 mm") +
    row("clear", "75% · 1500 · 4×") +
    row("cutout", "100% · 6× · w 0.30") +
    row("pulse", "200 ns · 40 kHz") +
    row("min gap", `${B.min_gap.toFixed(3)} mm`);
}

function esc(s){
  return String(s).replace(/[<&>]/g, c => c==="<" ? "&lt;" : c===">" ? "&gt;" : "&amp;");
}
// Pull the sentence that actually says what went wrong out of the converter's
// output, so it can be shown instead of a pointer to it.
function whyRefused(log){
  const lines = log.split("\n").map(l=>l.trim()).filter(Boolean);
  const refusing = lines.find(l => l.startsWith("Refusing to write"));
  if (refusing){
    const first = lines.find(l => /^(pad |hole |a drawn trace|outline )/.test(l));
    const tail = refusing.replace(/^Refusing to write a laser file:\s*/, "");
    return first ? `${tail.split(".")[0]} — e.g. ${first}` : tail;
  }
  const refused = lines.find(l => l.startsWith("REFUSED:"));
  if (refused) return refused.replace(/^REFUSED:\s*/, "");
  const err = lines.slice().reverse().find(l => /Error|Traceback|error:/i.test(l));
  return err || lines[0] || "the converter refused without saying why";
}

async function exportFile(btn, url, fallbackName){
  const log = document.getElementById("burnLog");
  log.innerHTML = "";
  btn.classList.add("busy"); btn.classList.remove("ok");
  try{
    // The server builds from the SAVED file. Flush first, or a file cut from
    // this download would be one autosave behind what is on screen.
    if (dirty) await save();
    const r = await fetch(url);
    if (!r.ok){
      const j = await r.json().catch(()=>({log:"the server said no and gave no reason"}));
      const raw = j.log || "";
      const why = whyRefused(raw);
      // Say the actual reason, here and in the toast. A message ABOUT an error
      // is not an error message: it just sends you looking for the real one.
      log.innerHTML =
        `<div class="why"><b>✕ Nothing was written</b>${esc(why)}</div>` +
        `<pre>${esc(raw)}</pre>`;
      log.scrollIntoView({block:"nearest", behavior:"smooth"});
      toast(why, true);
      return;
    }
    const cd = r.headers.get("Content-Disposition") || "";
    const m = cd.match(/filename="([^"]+)"/);
    const name = m ? m[1] : fallbackName;
    const blob = await r.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
    btn.classList.add("ok");
    toast("Downloaded " + name);
  }catch(e){
    const why = `could not reach the server: ${e && e.message ? e.message : e}`;
    log.innerHTML = `<div class="why"><b>✕ Nothing was written</b>${esc(why)}</div>`;
    log.scrollIntoView({block:"nearest", behavior:"smooth"});
    toast(why, true);
  }finally{
    btn.classList.remove("busy");
  }
}

/* ============================ 3D view ================================== */
/* Honest body sizes per real part - the pinheader courtyards lie about what is
   actually soldered (a bent axial resistor, a radial can, a standing TO-220). */
const BODY = {
  JP:{w:24, h:2.6, z:8.5, c:"#4a4440", note:"socket 9"},
  JS:{w:19, h:2.6, z:8.5, c:"#4a4440", note:"socket 7"},
  JU:{w:11, h:2.6, z:9,   c:"#333", note:"header 4"},
  PA:{w:16, h:2.6, z:9,   c:"#333", note:"header 6"},
  PB:{w:16, h:2.6, z:9,   c:"#333", note:"header 6"},
  LA:{w:6,  h:2.6, z:9,   c:"#333", note:"header 2"},
  LB:{w:6,  h:2.6, z:9,   c:"#333", note:"header 2"},
  QA:{w:10.2,h:4.6,z:16,  c:"#66727e", note:"IRLZ44N standing"},

  RGB:{w:9.5,h:2.5, z:2.6, c:"#a8763e", note:"axial 120R"},
  RPA:{w:9.5,h:2.5, z:2.6, c:"#a8763e", note:"axial 10k"},
  RPB:{w:9.5,h:2.5, z:2.6, c:"#a8763e", note:"axial 10k"},
  C1:{w:10.5,h:10.5,z:17,  c:"#2e3a6e", note:"330uF 63V radial"},
};
const LEGEND = [
  ["JP JS",   "#4a4440",    "XIAO ESP32-S3 + sockets",       "24 \u00d7 18 \u00d7 13 mm"],
  ["JU",      "#333",    "USB-C escape, 4 pin",           "11 \u00d7 2.6 \u00d7 9 mm"],
  ["PA PB",   "#333",    "ToF pod header, 6 pin",         "16 \u00d7 2.6 \u00d7 9 mm"],
  ["LA LB",   "#333",    "laser header, 2 pin",           "6 \u00d7 2.6 \u00d7 9 mm"],
  ["QA QB",   "#66727e", "IRLZ44N TO-220, standing",      "10.2 \u00d7 4.6 \u00d7 16 mm"],
  ["RGA RGB", "#a8763e", "120 \u03a9 axial, bent 7.62",  "9.5 \u00d7 2.5 \u00d7 2.6 mm"],
  ["RPA RPB", "#a8763e", "10 k\u03a9 axial, bent 7.62",  "9.5 \u00d7 2.5 \u00d7 2.6 mm"],
  ["C1",      "#2e3a6e", "330 \u00b5F 63 V \u00b7 square = +", "\u2300 10.5 \u00d7 17 mm"],
  ["board",   "#7a5a3c", "FR4, 35 \u00b5m copper",       "60 \u00d7 40 \u00d7 1.6 mm"],
];
(function(){
  const el = document.getElementById("legend");
  for (const [refs, col, what, dims] of LEGEND){
    el.insertAdjacentHTML("beforeend",
      `<i style="background:${col}"></i><b>${refs}</b>` +

const cv3 = document.getElementById("cv3"), c3 = cv3.getContext("2d");
let yaw = 0.6, pitch = 1.0, zoom3 = 9;
function render3d(){
  cv3.width = cv3.clientWidth * DPR; cv3.height = cv3.clientHeight * DPR;
  const css = getComputedStyle(document.documentElement);
  const C3 = n => css.getPropertyValue(n).trim();
  c3.clearRect(0,0,cv3.width,cv3.height);
  const S = zoom3 * DPR, ox = cv3.width/2, oy = cv3.height/2;
  const ca = Math.cos(yaw), sa = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  // +y on the board renders UP, matching the Board tab. z lifts up.
  function P3(x, y, z){
    const x1 = x*ca - y*sa, y1 = x*sa + y*ca;
    return [ox + x1*S, oy - (y1*cp + z*sp)*S, y1];
  }
  function face(pts, fill, stroke){
    c3.beginPath();
    c3.moveTo(pts[0][0], pts[0][1]);
    for (let i=1;i<pts.length;i++) c3.lineTo(pts[i][0], pts[i][1]);
    c3.closePath();
    c3.fillStyle = fill; c3.fill();
    if (stroke){ c3.strokeStyle = stroke; c3.lineWidth = 1*DPR; c3.stroke(); }
  }
  function shade(hex, f){
    const n = parseInt(hex.slice(1), 16);
    return `rgb(${(((n>>16)&255)*f)|0},${(((n>>8)&255)*f)|0},${((n&255)*f)|0})`;
  }
  // Collect every face of every component into ONE list and sort globally by
  // depth. Sorting whole boxes made touching parts appear to interpenetrate,
  // which is precisely the artefact that hides real collisions.
  const faces = [], labels = [];
  function box(cx, cy, w, h, z0, z1, col, rotDeg, name){
    const t = (rotDeg||0) * Math.PI/180, ct = Math.cos(t), st = Math.sin(t);
    const cor = [[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]]
      .map(([dx,dy]) => [cx + dx*ct - dy*st, cy + dx*st + dy*ct]);
    const top = cor.map(([x,y]) => P3(x,y,z1));
    const bot = cor.map(([x,y]) => P3(x,y,z0));
    for (let i=0;i<4;i++){
      const j = (i+1)%4;
      faces.push({d: (top[i][2]+top[j][2])/2,
                  pts: [bot[i],bot[j],top[j],top[i]],
                  fill: shade(col, i%2 ? 0.6 : 0.78), stroke: "rgba(0,0,0,.4)"});
    }
    faces.push({d: Math.min(...top.map(p=>p[2])) - 0.001,
                pts: top, fill: col, stroke: "rgba(0,0,0,.5)"});
    if (name){
      const mx = top.reduce((q,p)=>q+p[0],0)/4, my = top.reduce((q,p)=>q+p[1],0)/4;
      labels.push([name, mx, my]);
    }
  }
  // board slab first - everything sits on top of it, so it never occludes.
  // The REAL outline is extruded, so a hand-drawn board looks like itself here.
  const ol = outlineNow();
  const bx0 = Math.min(...ol.map(p=>p[0])), bx1 = Math.max(...ol.map(p=>p[0]));
  const by0 = Math.min(...ol.map(p=>p[1])), by1 = Math.max(...ol.map(p=>p[1]));
  {
    const top = ol.map(([x,y]) => P3(x, y, 0));
    const bot = ol.map(([x,y]) => P3(x, y, -1.6));
    for (let i=0;i<ol.length;i++){
      const j = (i+1) % ol.length;
      faces.push({d: (top[i][2]+top[j][2])/2,
                  pts: [bot[i],bot[j],top[j],top[i]],
                  fill: shade("#7a5a3c", 0.62), stroke: "rgba(0,0,0,.4)"});
    }
    faces.push({d: Math.min(...top.map(p=>p[2])) - 0.001,
                pts: top, fill: "#7a5a3c", stroke: "rgba(0,0,0,.5)"});
  }
  faces.sort((a,b)=>b.d-a.d);
  for (const f of faces) face(f.pts, f.fill, f.stroke);
  faces.length = 0;
  // pads and holes lie on the board plane, under every component
  for (const p of B.pads){
    const [sx,sy] = P3(p.x, p.y, 0.02);
    c3.beginPath(); c3.arc(sx, sy, Math.max(1.5*DPR, 0.8*S), 0, 7);
    c3.fillStyle = C3("--cu"); c3.fill();
  }
  for (const h of (holesOwnedHere() ? boardHoles : B.holes)){
    const [sx,sy] = P3(h.x, h.y, 0.02);
    c3.beginPath(); c3.arc(sx, sy, (h.d/2)*S, 0, 7);
    c3.fillStyle = "#14100c"; c3.fill();
  }
  // all component faces, one global depth sort
  for (const c of (B.comps||[])){
    const bd = BODY[c.name] || {w:c.w, h:c.h, z:3, c:"#666"};
    const rot = (bd.w >= bd.h) === (c.w >= c.h) ? c.rot : (c.rot + 90);
    box(c.x, c.y, bd.w, bd.h, 0, bd.z, bd.c, rot, c.name);
  }
  faces.sort((a,b)=>b.d-a.d);
  for (const f of faces) face(f.pts, f.fill, f.stroke);
  // labels last, never occluded
  c3.font = `${11*DPR}px ui-monospace,monospace`;
  c3.textAlign = "center";
  for (const [name, mx, my] of labels){
    c3.fillStyle = "rgba(0,0,0,.55)";
    c3.fillText(name, mx+1, my-3*DPR+1);
    c3.fillStyle = "rgba(239,231,220,.95)";
    c3.fillText(name, mx, my-3*DPR);
  }
  c3.textAlign = "left";
  c3.font = `${12*DPR}px ui-monospace,monospace`;
  c3.fillStyle = "rgba(239,231,220,.5)";
  c3.fillText(`board ${Math.round(bx1-bx0)} x ${Math.round(by1-by0)} mm - ` +
              `drag to orbit, pinch to zoom`, 14*DPR, cv3.height - 14*DPR);
}
const f3 = new Map(); let pinch3 = null;
cv3.addEventListener("pointerdown", e=>{ e.preventDefault();
  f3.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (f3.size === 2){
    const [a,b] = [...f3.values()];
    pinch3 = {d: Math.hypot(a[0]-b[0], a[1]-b[1]), z: zoom3};
  }
  cv3.setPointerCapture(e.pointerId);
});
cv3.addEventListener("pointermove", e=>{ e.preventDefault();
  if (!f3.has(e.pointerId)) return;
  const prev = f3.get(e.pointerId);
  f3.set(e.pointerId, [e.offsetX, e.offsetY]);
  if (f3.size === 1){
    yaw   += (e.offsetX - prev[0]) * 0.01;
    pitch = Math.max(0.15, Math.min(1.5, pitch + (e.offsetY - prev[1]) * 0.008));
    render3d();
  } else if (pinch3){
    const [a,b] = [...f3.values()];
    zoom3 = Math.max(3, Math.min(40, pinch3.z * Math.hypot(a[0]-b[0],a[1]-b[1]) / pinch3.d));
    render3d();
  }
});
function end3(e){ f3.delete(e.pointerId); if (f3.size < 2) pinch3 = null; }
cv3.addEventListener("pointerup", end3);
cv3.addEventListener("pointercancel", end3);
cv3.addEventListener("wheel", e=>{ e.preventDefault();
  zoom3 = Math.max(3, Math.min(40, zoom3 * (e.deltaY < 0 ? 1.1 : 0.9)));
  render3d();
}, {passive:false});

/* ---- fit the board to the screen, whatever shape it now is ---- */
function fitView(){
  const ol = outlineNow();
  const xs = ol.map(p=>p[0]), ys = ol.map(p=>p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const y0 = Math.min(...ys), y1 = Math.max(...ys);
  // the schematic view draws a margin of sheet around the blank, and the
  // title block below it, so "fit" has to take in more than the outline
  const pad  = curView === "schem" ? SILK_MARGIN : 0;
  const foot = curView === "schem" ? SILK_FOOT   : 0;
  const bw = Math.max(x1-x0, 1) + 2*pad;
  const bh = Math.max(y1-y0, 1) + pad + foot;
  const X0 = x0 - pad, Y1 = y1 + pad;
  view.s = Math.min(cv.clientWidth/(bw*1.08), cv.clientHeight/(bh*1.08));
  view.x = X0 - (cv.clientWidth/view.s - bw)/2;
  view.y = Y1 + (cv.clientHeight/view.s - bh)/2;
  marker = null;
}
document.getElementById("fitB").onclick = ()=>{ fitView(); draw(); };
document.getElementById("gridB").onclick = e=>{
  showGrid = !showGrid;
  e.currentTarget.classList.toggle("on", showGrid);
  draw();
};

/* ---- fly the canvas to an alert location, drop a crosshair ---- */
function flyTo(x, y){
  view.s = Math.max(view.s, 22);
  view.x = x - cv.clientWidth  / (2 * view.s);
  view.y = y + cv.clientHeight / (2 * view.s);
  marker = {x, y};
  draw();
}

/* ---- smoothness slider (vertical, lives in its popover) ---- */
const smEl = document.getElementById("smooth");
function smRender(){
  const h = smEl.clientHeight;
  smEl.querySelector(".fill").style.height = (smoothVal*h) + "px";
  smEl.querySelector(".knob").style.top = ((1 - smoothVal)*h) + "px";
}
function smSet(e){
  const r = smEl.getBoundingClientRect();
  smoothVal = Math.max(0, Math.min(1, (r.bottom - e.clientY) / r.height));
  smRender();
}
smEl.addEventListener("pointerdown", e=>{
  e.preventDefault(); smEl.setPointerCapture(e.pointerId); smSet(e);
});
smEl.addEventListener("pointermove", e=>{
  if (smEl.hasPointerCapture && smEl.hasPointerCapture(e.pointerId)) smSet(e);
});

/* ============================ boot ===================================== */
async function boot(){
  B = await (await fetch("/board")).json();
  if (B.project) document.title = "Trilha · " + B.project;
  const t = await (await fetch("/traces")).json();
  strokes = t.strokes || [];
  moves = t.moves || {};
  drawnOutline = (t.board && t.board.outline) || null;
  boardHoles = (t.board && t.board.holes) || [];
  // remember design positions so moves stay offsets, never accumulate
  for (const p of B.pads){ p.bx = p.x; p.by = p.y; }
  for (const c of (B.comps||[])){ c.bx = c.x; c.by = c.y; }
  applyMoves();
  new ResizeObserver(()=>{ resize(); }).observe(cv);
  document.getElementById("panelDraw").classList.add("show");
  fitView(); resize(); analyze(); draw();
}
boot();
